<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: vitrine estilo streaming — barra no topo, destaque grande, prateleiras com rolagem lateral, ficha do episódio em folha */
:root{
  color-scheme:dark;
  --bg:#15122E; --bg2:#100D26; --surface:#221D4A; --surface2:#2D2762; --line:#3E3680;
  --fg:#F4F1FF; --muted:#ABA4D6; --dim:#7D75B2; --ink:#1A1433;
  --f:#FFC93C; --f-d:#B8841A; --d:#3DD6F5; --d-d:#1C8FAB; --e:#FF5C7A; --e-d:#B42A47; --m:#8BE36A; --m-d:#4E9A35;
  --v:#9B7BFF; --o:#FF9A3C;
  --font-display:"Bungee","Arial Black",Impact,sans-serif;
  --font-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 40px;overflow-x:hidden;
  background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--d);outline-offset:3px}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px;
  background:linear-gradient(var(--bg) 60%,rgba(21,18,46,0))}
.top-row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:7px}
.brand img{height:22px;width:auto}
.brand-sep{width:2px;height:22px;background:var(--line);border-radius:2px}
.brand-title{font-family:var(--font-display);font-size:15px;letter-spacing:.02em;white-space:nowrap}
.top-sp{flex:1}
.snd{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--fg)}
.snd svg{width:20px;height:20px}
.snd.off{color:var(--dim)}
@media (max-width:420px){.brand-title{display:none}}

/* destaque */
.hero{position:relative;margin-top:8px;border-radius:28px;overflow:hidden;border:2px solid var(--line);display:grid;grid-template-columns:1fr;background:var(--bg2)}
@media (min-width:760px){.hero{grid-template-columns:1.05fr 1fr}}
.hero>*{min-width:0}
.hero-art{position:relative;min-height:300px;aspect-ratio:4/3;max-width:100%}
@media (min-width:760px){.hero-art{aspect-ratio:auto;min-height:400px;order:2}}

.hero-body{position:relative;padding:22px 20px 24px;display:grid;gap:12px;align-content:center}
@media (min-width:760px){.hero-body{padding:40px 36px}}
.tagline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.new{background:var(--e);color:#fff}
.tag.ep{background:var(--f);color:var(--ink)}
.hero h1{font-size:clamp(36px,9vw,64px);line-height:.95}
.hero h1 small{display:block;font-size:.3em;color:var(--d);letter-spacing:.1em;margin-bottom:8px}
.hero p.desc{color:var(--muted);font-size:16px;max-width:52ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:800;font-size:14px;color:var(--fg)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px;color:var(--m)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.btn{border:none;border-radius:16px;padding:14px 22px;font-weight:900;font-size:16px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;
  background:var(--f);color:var(--ink);box-shadow:0 5px 0 var(--f-d);display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--f-d)}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 5px 0 #1E1A44}
.btn.ghost:active{box-shadow:0 1px 0 #1E1A44}
.btn.soon{background:var(--surface2);color:var(--muted);box-shadow:0 5px 0 #1E1A44;cursor:default}

/* arte das capas */
.art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(155deg,var(--a) 0%,var(--b) 100%)}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.18) 1.2px,transparent 0) 0 0/14px 14px;opacity:.55;mix-blend-mode:overlay}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,13,38,.05) 30%,rgba(16,13,38,.92) 100%)}
.glyph{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:62%;max-width:240px;color:rgba(16,13,38,.78);z-index:1}
.glyph svg{width:100%;height:auto;display:block}
.glyph.txt{font-family:var(--font-display);font-size:clamp(54px,14vw,96px);line-height:1;text-align:center;width:auto;color:rgba(16,13,38,.8)}
.tiles{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg);display:grid;grid-template-columns:1fr 1fr;gap:8%;width:56%;max-width:230px;z-index:1}
.tiles i{aspect-ratio:1;border-radius:22%;display:grid;place-items:center;font-family:var(--font-display);font-style:normal;color:var(--ink);font-size:clamp(22px,6vw,48px);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.art-brand{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;align-items:center;gap:5px;font-weight:900;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.art-brand img{height:13px;width:auto}
.art-title{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;font-family:var(--font-display);font-size:17px;line-height:1.05;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);overflow-wrap:anywhere}
.art-title small{display:block;font-family:var(--font-body);font-weight:900;font-size:10px;letter-spacing:.14em;color:var(--f);margin-bottom:3px;text-shadow:none}
.ribbon{position:absolute;z-index:3;top:16px;right:-38px;transform:rotate(35deg);background:var(--f);color:var(--ink);font-weight:900;font-size:11px;letter-spacing:.1em;
  padding:5px 42px;box-shadow:0 3px 0 var(--f-d)}
.soon-art .art{filter:saturate(.8) brightness(.85)}
.scene{position:absolute;inset:0;z-index:1}
.scene svg{width:100%;height:100%;display:block}
.sheet-art:has(.scene){aspect-ratio:5/4}
.card .art-brand span{display:none}
.card-cap .nw{background:var(--e);color:#fff;font-weight:900;font-size:10px;letter-spacing:.1em;padding:2px 7px;border-radius:6px}
.badge-new{position:absolute;z-index:3;top:30px;left:10px;background:var(--e);color:#fff;font-weight:900;font-size:10px;letter-spacing:.12em;padding:3px 8px;border-radius:6px}
.hero-art .art-title{font-size:clamp(22px,5vw,30px);left:18px;bottom:16px}
.hero-art .art-brand{top:16px;left:18px;font-size:11px}
.hero-art .art-brand img{height:16px}

/* prateleiras */
.shelf{margin-top:30px}
.shelf-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.shelf-h h2{font-size:clamp(20px,5vw,26px)}
.shelf-h span{font-weight:800;font-size:13px;color:var(--dim)}
.rail-wrap{position:relative;margin-inline:-16px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:6px 16px 18px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:clamp(132px,38vw,196px);scroll-snap-align:start;border:none;padding:0;background:none;text-align:left;display:grid;gap:8px}
.poster{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:2px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s;max-width:100%}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-4px) scale(1.03);border-color:var(--d);box-shadow:0 12px 24px rgba(0,0,0,.4)}
.card-cap{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);padding-inline:2px}
.card-cap b{color:var(--m);font-weight:900}
.card-cap .s{color:var(--f)}
.arrow{position:absolute;top:6px;bottom:18px;width:44px;border:none;z-index:4;display:none;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(90deg,rgba(21,18,46,.95),rgba(21,18,46,0))}
.arrow.r{right:0;background:linear-gradient(270deg,rgba(21,18,46,.95),rgba(21,18,46,0))}
.arrow.l{left:0}
.arrow svg{width:26px;height:26px}
@media (hover:hover) and (pointer:fine){.rail-wrap:hover .arrow{display:flex}}

/* ficha */
.sheet-ov{position:fixed;inset:0;z-index:60;background:rgba(10,8,25,.72);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.sheet-ov{align-items:center;padding:24px}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:2px solid var(--line);border-radius:26px 26px 0 0;animation:up .32s cubic-bezier(.2,.9,.3,1)}
@media (min-width:700px){.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet-art{position:relative;aspect-ratio:16/9;max-width:100%}
.sheet-art .glyph,.sheet-art .tiles{top:42%;width:34%}
.sheet-art .glyph.txt{width:auto}
.sheet-art .art-title{font-size:26px;left:18px;bottom:14px}
.sheet-art .art-brand{top:14px;left:18px;font-size:11px}
.sheet-x{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:none;background:rgba(16,13,38,.75);color:#fff;display:grid;place-items:center}
.sheet-x svg{width:18px;height:18px}
.sheet-body{padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet-body p{color:var(--muted)}
.gets{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.gets li{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.gets li i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-size:13px;color:var(--ink)}
.sheet-body .btn{width:100%}
.lbl{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* abertura */
.splash{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0) 0 0/22px 22px;transition:opacity .5s,transform .5s;cursor:pointer}
.splash::before{content:"";position:absolute;width:560px;height:560px;max-width:150vw;max-height:150vw;border-radius:50%;left:50%;top:44%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(61,214,245,.22),rgba(255,201,60,.08) 55%,transparent);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.75}}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp{position:relative;display:grid;gap:20px;justify-items:center;text-align:center;width:100%;max-width:440px}
.sp-logo{display:flex;align-items:center;gap:10px;height:54px}
.sp-logo img{height:54px;width:auto;max-width:none}
.sp-mark{animation:markIn .9s cubic-bezier(.2,1.4,.4,1) .15s both}
.sp-word{animation:wordIn .7s cubic-bezier(.2,.9,.3,1) .7s both}
@keyframes markIn{0%{opacity:0;transform:scale(.2) rotate(-120deg)}100%{opacity:1;transform:none}}
@keyframes wordIn{0%{opacity:0;transform:translateX(-24px);clip-path:inset(0 100% 0 0)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.sp-kicker{font-weight:900;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:fadeUp .5s 1.1s both}
.sp-title{font-family:var(--font-display);font-size:clamp(44px,13vw,70px);line-height:.95;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.sp-title span{display:inline-block;animation:letterIn .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes letterIn{0%{opacity:0;transform:translateY(30px) scale(.4) rotate(12deg)}100%{opacity:1;transform:none}}
.sp-stroke{width:min(330px,86%);height:auto;overflow:visible;margin-top:-6px}
.sp-stroke path{fill:none;stroke:url(#penGrad);stroke-width:7;stroke-linecap:round;stroke-dasharray:420;animation:draw 1s cubic-bezier(.6,0,.3,1) 2s both}
@keyframes draw{0%{stroke-dashoffset:420}100%{stroke-dashoffset:0}}
.sp-sub{font-weight:900;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--d);animation:fadeUp .5s 2.7s both}
.sp .btn{min-width:230px;animation:fadeUp .5s 3s both}
.sp-tap{font-size:12px;font-weight:800;color:var(--dim);animation:fadeUp .5s 3.2s both}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}

.foot{margin-top:40px;text-align:center;color:var(--dim);font-size:12px;font-weight:700;display:grid;gap:8px;justify-items:center}
.ver{font-variant-numeric:tabular-nums;opacity:.85}
.foot .brand img{height:20px;opacity:.8}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

@media (max-width:759px){
  .hero{margin-top:2px;border-radius:22px}
  .hero-art{aspect-ratio:auto;min-height:0;height:clamp(150px,25vh,220px)}
  .hero-art .art-brand{top:12px;left:14px;font-size:10px}
  .hero-body{padding:12px 16px 16px;gap:8px}
  .hero h1{font-size:clamp(28px,8.4vw,38px)}
  .hero h1 small{display:none}
  .tagline{gap:6px}
  .hero .tagline .tag:nth-child(3){display:none}
  .tag{font-size:10px;padding:4px 8px;letter-spacing:.1em}
  .meta{font-size:13px;gap:2px 12px}
  .hero p.desc{font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .actions{gap:10px;margin-top:2px}
  .actions .btn{flex:1;padding:11px 12px;font-size:14px}
  .shelf{margin-top:20px}
  .shelf-h{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>

/* ---------- som ---------- */
const SND = (()=>{
  let ctx=null, on=true; try{ on = localStorage.getItem("cm-sound")!=="off"; }catch(e){}
  const ac=()=>{ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ctx=new C();}catch(e){return null;} } if(ctx.state==="suspended") ctx.resume(); return ctx; };
  const tone=(f,t0,d,ty,v,f2)=>{ const c=ac(); if(!c) return; const n=c.currentTime+t0,o=c.createOscillator(),g=c.createGain(); o.type=ty||"triangle"; o.frequency.setValueAtTime(f,n); if(f2) o.frequency.exponentialRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(v||.1,n+.012); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+.05); };
  const FX={
    chime:()=>[1318.5,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,i*.12,.7,"sine",.08)),
    open:()=>{ tone(660,0,.09,"triangle",.09,990); tone(1320,.07,.12,"sine",.05); },
    play:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.07,.2,"square",.05)),
    soon:()=>{ tone(440,0,.12,"triangle",.07); tone(392,.1,.16,"triangle",.06); },
    close:()=>tone(700,0,.07,"sine",.05,500)
  };
  return { play(n){ if(on&&FX[n]) try{FX[n]();}catch(e){} }, get on(){return on;}, toggle(){ on=!on; try{localStorage.setItem("cm-sound",on?"on":"off");}catch(e){} if(on){ac();FX.open();} return on; } };
})();
function syncSound(){ document.querySelectorAll("[data-act=sound]").forEach(b=>{ b.classList.toggle("off",!SND.on); b.innerHTML = SND.on?IC.sndOn:IC.sndOff; b.setAttribute("aria-label", SND.on?"Som ligado. Toque para desligar":"Som desligado. Toque para ligar"); }); }

/* ---------- arte ---------- */
function artHTML(ep, opts={}){
  let g;
  if(ep.art.startsWith("scene:")){ const k = ep.art.slice(6); const vb = opts.vb || (opts.wide ? "0 34 200 176" : "0 0 200 300");
    g = `<div class="scene"><svg viewBox="${vb}" preserveAspectRatio="xMidYMid ${opts.fit||"slice"}" aria-hidden="true">${SCENES[k]()}</svg></div>`; }
  else if(ep.art==="tiles") g = `<div class="tiles"><i style="background:var(--f)">F</i><i style="background:var(--d)">D</i><i style="background:var(--e)">E</i><i style="background:var(--m)">M</i></div>`;
  else if(ep.art.startsWith("txt:")) g = `<div class="glyph txt">${esc(ep.art.slice(4))}</div>`;
  else g = `<div class="glyph">${ART[ep.art]||""}</div>`;
  const kicker = ep.status==="live" ? `Episódio ${pad(ep.num)}` : "Em breve!";
  return `<div class="art" style="--a:${ep.a};--b:${ep.b}"></div>${g}
    <div class="art-brand"><img src="${LOGO_MARK}" alt=""><span>Canetinha Mágica</span></div>
    ${opts.noTitle?"":`<div class="art-title"><small>${kicker}</small>${esc(ep.title)}</div>`}`;
}
function cardHTML(id){
  const ep = EPISODES[id], live = ep.status==="live";
  return `<button class="card ${live?"":"soon-art"}" data-ep="${id}" aria-label="${esc(ep.title)}${live?"":", em breve"}">
    <div class="poster">${artHTML(ep)}${live?"":`<span class="ribbon">EM BREVE!</span>`}</div>
    <div class="card-cap">${live?`<span>${(()=>{const pr=progress(ep); return pr ? `<b>${esc(pr.label)}</b>` : `<b>Disponível</b> · ${esc(ep.time||"")}`;})()}</span>${ep.isNew?`<span class="nw">NOVO</span>`:""}`:`<span class="s">Em breve!</span><span></span>`}</div>
  </button>`;
}

function progress(ep){
  if(!ep.store) return null;
  try{ const o = JSON.parse(localStorage.getItem(ep.store) || "null"); if(!o) return null;
    const last = ep.last || 6;
    if(o.step >= last) return {done:true, label:"Concluído ✓"};
    if(o.step >= 0) return {label:`Fase ${o.step} de ${last}`}; }catch(e){}
  return null;
}

function openSheet(id){
  const ep = EPISODES[id], live = ep.status==="live";
  closeSheet(true);
  const ov = document.createElement("div"); ov.className="sheet-ov"; ov.id="sheetOv";
  ov.innerHTML = `<div class="sheet ${live?"":"soon-art"}" role="dialog" aria-modal="true" aria-label="${esc(ep.title)}">
    <div class="sheet-art">${artHTML(ep,{wide:true})}<button class="sheet-x" data-act="close" aria-label="Fechar">${IC.x}</button></div>
    <div class="sheet-body">
      <div class="tagline">${live?`<span class="tag ep">Episódio ${pad(ep.num)}</span>${ep.isNew?`<span class="tag new">Novo</span>`:""}<span class="tag">${esc(ep.subject)}</span>`:`<span class="tag ep">Em breve!</span>`}</div>
      ${live?`
        <div class="meta"><span>${IC.check}${esc(ep.phases)}</span><span>${IC.clock}${esc(ep.time)}</span></div>
        <p>${esc(ep.desc)}</p>
        <div class="lbl">O que você leva</div>
        <ul class="gets">${ep.gets.map(([l,c,t])=>`<li><i style="background:${c}">${l}</i>${esc(t)}</li>`).join("")}</ul>
        <a class="btn" href="${ep.url}" data-play="${id}">${IC.play}${(()=>{const pr=progress(ep); return pr ? (pr.done?"Rever episódio":"Continuar episódio") : "Começar episódio";})()}</a>`
      :`
        <p>Este episódio está em produção e chega em breve à série Canetinha Mágica.</p>
        <span class="btn soon" aria-disabled="true">Em breve!</span>
        <button class="btn ghost" data-act="close">Ver todos os episódios</button>`}
    </div></div>`;
  document.body.appendChild(ov);
  document.documentElement.style.overflow="hidden";
  SND.play(live?"open":"soon");
  setTimeout(()=>{ const b = ov.querySelector(".sheet-x"); if(b) b.focus({preventScroll:true}); }, 50);
}
function closeSheet(silent){ const o=$("#sheetOv"); if(o){ if(location.pathname!=="/") history.replaceState(null,"","/"); o.remove(); document.documentElement.style.overflow=""; if(!silent) SND.play("close"); } }

document.addEventListener("click", e=>{
  if(e.target.id==="sheetOv"){ closeSheet(); return; }
  const play = e.target.closest("[data-play]"); if(play){ SND.play("play"); track("episode_play",{episode:(EPISODES[play.dataset.play]||{}).slug||play.dataset.play}); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.ep){ openSheet(b.dataset.ep); track("episode_details",{episode:EPISODES[b.dataset.ep].slug, status:EPISODES[b.dataset.ep].status}); return; }
  if(b.dataset.scroll){ const [i,d] = b.dataset.scroll.split(":"); const r = $("#rail-"+i); r.scrollBy({left: +d * r.clientWidth * .85, behavior:"smooth"}); return; }
  const act = b.dataset.act;
  if(act==="close"){ closeSheet(); return; }
  if(act==="sound"){ SND.toggle(); syncSound(); track("sound_toggle",{on:SND.on}); return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/* ---------- confete ---------- */
const cv=$("#fx"), ctx=cv.getContext("2d"); let parts=[], raf=null;
function size(){ const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; ctx.setTransform(r,0,0,r,0,0); }
addEventListener("resize",size); size();
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const css=getComputedStyle(document.documentElement), cols=["f","d","e","m"].map(c=>css.getPropertyValue("--"+c).trim());
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.45,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:Math.random()*7+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%4],life:1,sq:Math.random()<.5});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){ ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.38; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.009; ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    if(p.sq) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); else { ctx.beginPath(); ctx.arc(0,0,p.s/2.4,0,7); ctx.fill(); } ctx.restore(); });
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40); raf=parts.length?requestAnimationFrame(tick):(ctx.clearRect(0,0,innerWidth,innerHeight),null); }

/* ---------- abertura (uma vez por sessão) ---------- */
function splash(){
  let seen=false; try{ seen = sessionStorage.getItem("cm-splash")==="1"; }catch(e){}
  if(seen) return;
  const el=document.createElement("div"); el.className="splash"; el.id="splash";
  const title="Canetinha|Mágica".split("|").map((w,wi)=>w.split("").map((ch,i)=>`<span style="animation-delay:${(1.25+wi*.35+i*.05).toFixed(2)}s">${ch}</span>`).join("")).join("<br>");
  el.innerHTML=`<div class="sp">
    <div class="sp-logo"><img class="sp-mark" src="${LOGO_MARK}" alt=""><img class="sp-word" src="${LOGO_WORD}" alt="Proselling"></div>
    <div class="sp-kicker">apresenta</div>
    <h1 class="sp-title" aria-label="Canetinha Mágica">${title}</h1>
    <svg class="sp-stroke" viewBox="0 0 320 34" aria-hidden="true"><defs><linearGradient id="penGrad" x1="0" x2="1"><stop offset="0" style="stop-color:var(--f)"/><stop offset=".35" style="stop-color:var(--d)"/><stop offset=".68" style="stop-color:var(--e)"/><stop offset="1" style="stop-color:var(--m)"/></linearGradient></defs><path d="M8 22 C 60 6, 110 30, 165 17 S 260 6, 300 15"/></svg>
    <div class="sp-sub">Série original Proselling</div>
    <button class="btn" id="spEnter">Ver episódios</button>
    <div class="sp-tap">Toque em qualquer lugar para entrar</div>
  </div>`;
  document.body.appendChild(el);
  const sparkle=setTimeout(()=>burst(36),2800); let gone=false;
  const close=()=>{ if(gone) return; gone=true; clearTimeout(sparkle); SND.play("chime"); try{sessionStorage.setItem("cm-splash","1");}catch(e){} el.classList.add("out"); setTimeout(()=>el.remove(),520); };
  el.addEventListener("click",close);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" ") close(); });
  setTimeout(()=>{ const b=document.getElementById("spEnter"); if(b) b.focus({preventScroll:true}); },100);
}

render();
const ROUTE = location.pathname.replace(/^\/+|\/+$/g,"").toLowerCase();
const ROUTE_ID = ROUTE && Object.keys(EPISODES).find(k=>EPISODES[k].slug===ROUTE);
if(ROUTE_ID){
  try{ sessionStorage.setItem("cm-splash","1"); }catch(e){}
  openSheet(ROUTE_ID);
  track("episode_link_open",{episode:ROUTE, status:EPISODES[ROUTE_ID].status});
} else { splash(); }
addEventListener("pageshow", e=>{ if(e.persisted) render(); });
})();
</script>
