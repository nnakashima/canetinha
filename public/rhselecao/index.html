<style>
/* RH Seleção: ferramenta do gestor, sem gamificação. Mesmo visual da Canetinha, layout mais largo no laptop. */
:root{
  color-scheme:dark;
  --bg:#15122E; --surface:#221D4A; --surface2:#2D2762; --line:#3E3680;
  --fg:#F4F1FF; --muted:#ABA4D6; --dim:#7D75B2; --ink:#1A1433;
  --f:#FFC93C; --f-d:#B8841A; --d:#3DD6F5; --d-d:#1C8FAB; --e:#FF5C7A; --e-d:#B42A47; --m:#8BE36A; --m-d:#4E9A35;
  --v:#9B7BFF; --o:#FF9A3C;
  --font-display:"Bungee","Arial Black",Impact,sans-serif;
  --font-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.5;padding:0 16px 56px;
  background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/22px 22px;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1120px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--d)}
:focus-visible{outline:3px solid var(--d);outline-offset:2px;border-radius:8px}

/* topo */
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:rgba(21,18,46,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{height:22px;width:auto}
.brand .t{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand .t b{font-family:var(--font-display);font-size:15px;font-weight:400;white-space:nowrap}
.brand .t small{color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.top .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:14px}
.iconbtn svg{width:18px;height:18px}
.steps{max-width:1120px;margin:10px auto 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.step i{display:block;height:6px;border-radius:3px;background:var(--surface2)}
.step span{display:block;font-size:12px;font-weight:800;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done i{background:var(--m)} .step.cur i{background:var(--f)} .step.cur span{color:var(--fg)} .step.done span{color:var(--muted)}
.step[disabled]{cursor:not-allowed}

/* telas */
.screen{padding-top:22px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--d)}
.screen h1{font-size:clamp(24px,5vw,32px);margin:6px 0 8px}
.lead{color:var(--muted);font-size:16px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h2{font-size:17px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px}
.q{margin-top:16px}
.q:first-child{margin-top:0}
.ql{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:900;font-size:15px}
.ql small{color:var(--dim);font-weight:700;font-size:13px}
.ql .req{color:var(--f);font-size:12px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14.5px;cursor:pointer;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--dim)}
.chip.on{background:rgba(255,201,60,.16);border-color:var(--f);color:var(--fg)}
.chip.on::before{content:"✓ ";color:var(--f)}
.grid2{display:grid;grid-template-columns:1fr;gap:0 24px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
label.fl{display:block;font-weight:900;font-size:15px;margin-top:16px}
label.fl small{color:var(--dim);font-weight:700}
.inp{width:100%;margin-top:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{border-color:var(--d);outline:none}
textarea.inp{min-height:92px;resize:vertical}
.mic-wrap{position:relative;display:block}
.mic-wrap .inp{padding-right:48px}
.mic{position:absolute;right:6px;top:12px;width:36px;height:36px;border-radius:10px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.mic svg{width:18px;height:18px}
.mic.rec{background:var(--e);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.count{display:inline-flex;align-items:center;gap:8px;margin-top:8px}
.count button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;font-weight:900;cursor:pointer}
.count b{min-width:32px;text-align:center;font-size:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:16px;cursor:pointer;background:var(--f);color:var(--ink);box-shadow:0 4px 0 var(--f-d);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--f-d)}
.btn.sec{background:var(--surface2);color:var(--fg);box-shadow:0 4px 0 #17133A;border:1px solid var(--line)}
.btn.green{background:var(--m);box-shadow:0 4px 0 var(--m-d)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.ghost{background:none;box-shadow:none;color:var(--muted);border:1px dashed var(--line)}
.btn svg{width:18px;height:18px}
.btn.busy{opacity:.6;pointer-events:none}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}
.miss{margin-top:12px;background:rgba(255,201,60,.12);border:1px solid var(--f);border-radius:12px;padding:10px 12px;font-weight:800;font-size:14.5px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.note{color:var(--muted);font-size:13.5px;margin-top:10px}
.tag{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}

/* processos */
.procs{display:grid;gap:10px;margin-top:10px}
@media(min-width:760px){.procs{grid-template-columns:1fr 1fr}}
.proc{display:flex;gap:12px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.proc.cur{border-color:var(--f)}
.proc .pi{flex:1;min-width:0}
.proc b{display:block;font-size:15px}
.proc small{color:var(--muted);font-size:13px}

/* candidatos */
.drop{margin-top:12px;border:2px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02)}
.drop.over{border-color:var(--d);background:rgba(61,214,245,.08)}
.drop b{display:block;font-size:16px}
.drop small{color:var(--muted)}
.drop svg{width:34px;height:34px;color:var(--d)}
.clist{display:grid;gap:8px;margin-top:12px}
.crow{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;color:var(--ink)}
.crow .ci{flex:1;min-width:0}
.crow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .bad{color:var(--e)}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.status{margin-top:10px;font-weight:800;font-size:14px;color:var(--muted)}
.status.err{color:var(--e)}

/* análise */
.alvo{display:grid;gap:10px;margin-top:10px}
@media(min-width:760px){.alvo{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prio{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.prio b{display:block;font-size:15px}
.prio p{color:var(--muted);font-size:13.5px}
.prio small{display:block;color:var(--dim);font-size:12px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-top:20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:900;font-size:15px;color:var(--muted);cursor:pointer}
.tab.on{color:var(--fg);border-color:var(--f)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.pill{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;font-weight:800;font-size:14px}
.pill .av{width:28px;height:28px;border-radius:9px;font-size:12px}
.pill.on{border-color:var(--f)}
.band{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--ink)}
.band.Alta{background:var(--m)} .band.Boa{background:var(--d)} .band.Atenção{background:var(--f)}
.ind{display:grid;gap:14px;margin-top:6px}
@media(min-width:900px){.ind{grid-template-columns:1.05fr 1fr}}
.ihead{display:flex;gap:14px;align-items:center}
.ihead .av{width:56px;height:56px;border-radius:16px;font-size:22px}
.ihead h2{font-size:20px}
.ihead .d{color:var(--muted);font-size:14px}
.bars{display:grid;gap:8px;margin-top:14px}
.bar{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:13.5px;font-weight:800}
.bar .tr{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px}
.bar em{font-style:normal;text-align:right;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kv div{background:var(--bg);border-radius:12px;padding:10px}
.kv small{display:block;color:var(--dim);font-size:11.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.kv b{font-size:15px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dots i.on{background:var(--m);border-color:var(--m)}
.plist{display:grid;gap:8px;margin-top:10px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;font-weight:800}
ul.li{margin:8px 0 0;padding-left:20px}
ul.li li{margin:4px 0}
ol.qs{margin:8px 0 0;padding-left:22px}
ol.qs li{margin:6px 0}
.sec-t{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--d);margin-top:16px}
.sec-t:first-child{margin-top:0}
.notas{margin-top:12px;display:grid;gap:6px}
.notas div{background:rgba(155,123,255,.12);border:1px solid rgba(155,123,255,.4);border-radius:12px;padding:8px 10px;font-size:14px}
.cmpwrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{background:var(--surface2);position:sticky;top:0}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:900;color:var(--muted);font-size:13px;min-width:130px}
.cmp thead th:first-child{background:var(--surface2)}
.cmp tbody tr:last-child td{border-bottom:0}
.selrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.keyd{margin-top:14px;display:grid;gap:8px}
.keyd div{background:var(--bg);border-left:4px solid var(--d);border-radius:8px;padding:8px 12px;font-size:14.5px}
.cov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.cov div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.cov b{display:block;font-family:var(--font-display);font-size:26px;font-weight:400}
.cov small{color:var(--muted);font-size:12.5px;font-weight:800}
.cov .zero b{color:var(--e)}
.empty{color:var(--muted);text-align:center;padding:24px 12px}
.decl{display:grid;gap:8px;margin-top:10px}
.dc{display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.dc.on{border-color:var(--m);background:rgba(139,227,106,.08)}
.dc .ci{flex:1;min-width:0}
.dc .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:var(--ink)}
.dc.on .ck{background:var(--m);border-color:var(--m)}
.follow{margin-top:12px;background:rgba(61,214,245,.08);border:1px solid var(--d-d);border-radius:14px;padding:12px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.warn{border-color:var(--f)}
.menu{position:absolute;right:16px;top:58px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:40;min-width:240px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-weight:800;cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu small{display:block;color:var(--dim);font-weight:700;font-size:12px}
.sheet-ov{position:fixed;inset:0;background:rgba(10,8,25,.7);display:flex;align-items:flex-end;justify-content:center;z-index:70}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px}
.sheet h3{font-size:18px;margin-bottom:8px}
.sheet p,.sheet li{color:var(--muted);font-size:14.5px}
.sheet .btn{width:100%;margin-top:10px}
/* capa */
.cover{padding:34px 0 8px;max-width:1120px;margin:0 auto}
.cover .kick{font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--d)}
.cover h1{font-size:clamp(30px,5.6vw,52px);line-height:1.08;margin:12px 0 16px;max-width:20ch}
.cover h1 b{font-weight:400;color:var(--f)}
.cover .quote{font-size:clamp(17px,2.3vw,22px);line-height:1.45;color:var(--muted);max-width:52ch;border-left:4px solid var(--f);padding-left:16px;font-weight:700}
.cover .quote em{font-style:normal;color:var(--fg)}
.flow{list-style:none;padding:0;margin:34px 0 0;display:grid;gap:10px}
.flow li{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.chev{height:52px;display:grid;place-items:center;font-weight:900;font-size:15.5px;color:#fff;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-right:12px}
.flow li:not(:first-child) .chev{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);padding-left:12px}
.flow p{color:var(--muted);font-size:15px;line-height:1.35}
@media(min-width:860px){.flow{grid-template-columns:repeat(5,minmax(0,1fr));gap:0 4px}.flow li{grid-template-columns:1fr;gap:12px;align-items:start}.chev{height:62px;font-size:17px}.flow p{text-align:center;padding:0 10px}}
.cover .acts{margin-top:34px}
.cover .btn{font-size:17px;padding:15px 26px}
.cover .meta{color:var(--dim);font-size:13.5px;margin-top:14px}
.foot{margin:40px auto 0;max-width:1120px;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.foot img{height:16px}
@media(max-width:520px){.brand .t small{display:none}.iconbtn span{display:none}.bar{grid-template-columns:92px 1fr 36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iOS: campos com menos de 16px fazem o Safari dar zoom na página e ela fica maior que a tela */
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{font-size:max(16px,1em)}
html,body{overflow-x:clip}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand" data-act="cover" role="button" tabindex="0" style="cursor:pointer" aria-label="Capa do RH Seleção"><img src="" id="lgMark" alt=""><div class="t"><b>RH Seleção</b><small>Canetinha Mágica · Episódio 03</small></div></div>
    <div class="sp"></div>
    <button class="iconbtn" data-act="menu" aria-haspopup="true" aria-label="Arquivo do processo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Arquivo</span></button>
  </div>
  <nav class="steps" id="steps" aria-label="Etapas"></nav>
</header>
<main id="app" class="wrap"></main>
<footer class="foot"><img src="" id="lgWord" alt="Proselling"><span>Canetinha Mágica · RH Seleção · Ferramenta de apoio à decisão: não substitui entrevista nem avaliação profissional.</span></footer>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="teamIn" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="impIn" accept="application/json,.json" hidden>
<script>
(function(){

  dor:{label:"Principal dor hoje", req:true, many:true, max:2, hint:"até 2", o:[["fila","Fila e demora"],["erros","Erros nos pedidos"],["atendimento","Atendimento"],["vendas","Vendas abaixo da meta"],["clima","Clima da equipe"],["rotatividade","Muita gente saindo"]]},
  saida:{label:"Por que as pessoas saem", many:true, hint:"pode marcar vários", o:[["salario","Salário"],["horario","Horário e escala"],["lideranca","Relação com a liderança"],["adaptacao","Não se adaptam à rotina"],["oportunidade","Outra oportunidade"],["naosei","Não sei"]]}
};
const CTX_ORDER = ["seg","fmt","idade","equipe","cli","pico","m2","mesas","deliv","fat","dor","saida"];
const VOPT = {
  pos:{label:"Posição", req:true, o:[["artista","Artista de Sanduíche"],["gerente","Gerente"],["outra","Outra posição"]]},
  outraTipo:{label:"Tipo da posição", o:[["operacao","Operação (atendimento, produção)"],["lideranca","Liderança (supervisão, gerência)"]]},
  turno:{label:"Turno", many:true, hint:"pode marcar vários", o:[["manha","Manhã"],["tarde","Tarde"],["noite","Noite"],["madrugada","Madrugada"],["fds","Fins de semana"],["integral","Integral"]]},
  tipo:{label:"Motivo da vaga", o:[["substituicao","Substituição"],["aumento","Aumento de quadro"]]}
};
const optLabel = (O, k, v) => { const f = (O[k].o.find(x=>x[0]===v)||[])[1]; return f || ""; };
const MOTIVOS = ["Melhor aderência à vaga","Foi bem na entrevista","Disponibilidade de horário","Experiência anterior","Mora perto","Indicação"];

/* ---------- estado (só neste aparelho) ---------- */
function blankProc(){ return {id:uid(), created:new Date().toISOString(),
  vaga:{pos:"", outraTitulo:"", outraTipo:"", turno:[], qtd:1, tipo:"", liderNome:"", lider:""},
  cands:[], team:[], notes:{}, tab:"ind", ind:null, sel:[],
  dec:{esc:[], motivos:[], texto:"", data:"", follow:{}}, res:null, resKey:""}; }
function blank(){ const p = blankProc(); return {v:1, step:0, ctx:{nome:"", obs:"", fmt:[], dor:[], saida:[]}, procs:[p], cur:p.id}; }
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1 && Array.isArray(s.procs) && s.procs.length) return s; }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const P = () => S.procs.find(p=>p.id===S.cur) || S.procs[0];
const vagaTitle = v => v.pos==="outra" ? (t(v.outraTitulo) || "Outra posição") : (optLabel(VOPT,"pos",v.pos) || "Vaga sem posição");

/* ---------- código S4D1 ---------- */
const CODE_RE = /S4D1-[A-Za-z?]{1,2}-\d{8}-\d{2}-\d{2}-[A-Z]{6}-[A-Z]{3}-[0-9A-Z]/g;
function codeOk(c){ const m = String(c||"").match(/^(S4D1-[A-Za-z?]{1,2}-\d{8}-\d{2}-\d{2}-[A-Z]{6}-[A-Z]{3})-([0-9A-Z])$/);
  if(!m) return false; const sum = [...m[1]].reduce((a,ch)=>a+ch.charCodeAt(0),0); return (sum%36).toString(36).toUpperCase()===m[2]; }

/* ---------- requisitos por etapa ---------- */
function missing(i){
  const c = S.ctx, p = P(), v = p.vaga;
  if(i===0){ const m = []; if(!c.seg) m.push(["seg","o segmento"]); if(!c.cli) m.push(["cli","os clientes por dia"]); if(!c.dor.length) m.push(["dor","a principal dor"]); return m; }
  if(i===1){ const m = []; if(!v.pos) m.push(["pos","a posição"]); if(v.pos==="outra" && !t(v.outraTitulo)) m.push(["outraTitulo","o nome da posição"]); if(v.pos==="outra" && !v.outraTipo) m.push(["outraTipo","o tipo da posição"]); if(t(v.lider) && !codeOk(t(v.lider))) m.push(["lider","um código do líder válido (ou deixe em branco)"]); return m; }
  if(i===2){ return p.cands.filter(x=>x.ok).length ? [] : [["drop","pelo menos um candidato com código válido"]]; }
  if(i===3){ return p.res ? [] : [["alvo","a análise"]]; }
  return [];
}
const complete = i => !missing(i).length;
const reach = i => { for(let k=0;k<i;k++) if(!complete(k)) return false; return true; };

/* ---------- componentes ---------- */
function chipsQ(O, key, obj, prefix){
  const q = O[key], val = obj[key];
  return `<div class="q" id="q-${key}"><div class="ql">${q.label}${q.req?'<span class="req">obrigatório</span>':""}${q.hint?`<small>${q.hint}</small>`:""}</div>
    <div class="chips" role="group" aria-label="${esc(q.label)}">${q.o.map(([v,l])=>{ const on = q.many ? (val||[]).includes(v) : val===v;
      return `<button type="button" class="chip${on?" on":""}" aria-pressed="${on}" data-chip="${prefix}.${key}" data-v="${v}">${esc(l)}</button>`; }).join("")}</div></div>`;
}
const field = (id, label, bind, val, opts={}) => `<label class="fl" for="${id}">${label}${opts.hint?` <small>${opts.hint}</small>`:""}</label>
  ${opts.ta ? `<textarea class="inp" id="${id}" data-bind="${bind}" placeholder="${esc(opts.ph||"")}">${esc(val)}</textarea>`
            : `<input class="inp" id="${id}" data-bind="${bind}" value="${esc(val)}" placeholder="${esc(opts.ph||"")}" ${opts.attr||""}>`}`;
const avatar = (c, i) => { const k = c.perfil && c.perfil.p1 || (c.code||"")[5]; const d = DISC[k]; return `<span class="av" style="background:${d?d.col:"var(--dim)"}">${esc((t(c.nome)||"?").slice(0,1).toUpperCase())}</span>`; };
const nav = (i, next) => `<div class="nav">${i>0?`<button class="btn sec" data-go="${i-1}">Voltar</button>`:"<span></span>"}${next?`<button class="btn" data-next="${i}">${next}</button>`:""}</div><div id="miss"></div>`;

/* ---------- tela 1: negócio ---------- */
function screen0(){
  const c = S.ctx, n = CTX_ORDER.filter(k => OPT[k].many ? (c[k]||[]).length : c[k]).length;
  return `<section class="screen"><div class="eyebrow">Etapa 1 de 5 · Seu negócio</div><h1>Conte sobre o seu negócio</h1>
    <p class="lead">Leva uns 3 minutos e fica salvo neste aparelho. Com isso, a ferramenta entende que tipo de pessoa encaixa melhor na sua operação.</p>
    <div class="card"><div class="grid2"><div>${field("ctxNome","Nome da loja ou do negócio","ctx.nome",c.nome,{hint:"opcional", ph:"Ex.: Loja Centro"})}</div></div></div>
    <div class="card"><h2>A operação</h2><p class="sub">${n} de ${CTX_ORDER.length} respondidas</p>
      <div class="grid2"><div>${["seg","fmt","idade","equipe"].map(k=>chipsQ(OPT,k,c,"ctx")).join("")}</div><div>${["cli","pico","m2","mesas","deliv","fat"].map(k=>chipsQ(OPT,k,c,"ctx")).join("")}</div></div></div>
    <div class="card"><h2>O que mais pesa hoje</h2><div class="grid2"><div>${chipsQ(OPT,"dor",c,"ctx")}</div><div>${chipsQ(OPT,"saida",c,"ctx")}</div></div>
      ${field("ctxObs","Algo mais sobre o negócio?","ctx.obs",c.obs,{ta:true, hint:"opcional, fica só no seu relatório", ph:"Ex.: perto de escola, muito movimento no fim de semana…"})}</div>
    ${nav(0,"Próximo: a vaga")}</section>`;
}

/* ---------- tela 2: vaga ---------- */

  const p = P(), v = p.vaga;
  const procs = S.procs.map(x=>`<button class="proc${x.id===p.id?" cur":""}" data-proc="${x.id}"><span class="pi"><b>${esc(vagaTitle(x.vaga))}</b><small>${x.cands.length} candidato${x.cands.length===1?"":"s"} · criado em ${fmtD(x.created)}${x.dec.data?" · decidido":""}</small></span><span class="tag">${x.id===p.id?"Aberto":"Abrir"}</span></button>`).join("");
  return `<section class="screen"><div class="eyebrow">Etapa 2 de 5 · A vaga</div><h1>Qual vaga você quer preencher?</h1>

      <div class="acts"><button class="btn sec small" data-act="newproc">+ Novo processo</button>${S.procs.length>1?`<button class="btn ghost small" data-act="delproc">Excluir este processo</button>`:""}</div></div>
    <div class="card"><div class="grid2"><div>${chipsQ(VOPT,"pos",v,"vaga")}
      ${v.pos==="outra" ? field("vTit","Nome da posição","vaga.outraTitulo",v.outraTitulo,{ph:"Ex.: Atendente de caixa"}) + chipsQ(VOPT,"outraTipo",v,"vaga") : ""}
      ${chipsQ(VOPT,"turno",v,"vaga")}</div>
      <div><div class="q"><div class="ql">Quantas vagas</div><div class="count"><button type="button" data-qtd="-1" aria-label="Menos">−</button><b>${v.qtd}</b><button type="button" data-qtd="1" aria-label="Mais">+</button></div></div>
      ${chipsQ(VOPT,"tipo",v,"vaga")}
      ${field("vLidN","Quem vai liderar esta pessoa?","vaga.liderNome",v.liderNome,{hint:"opcional", ph:"Nome do líder ou gerente"})}
      ${field("vLid","Código SELF do líder","vaga.lider",v.lider,{hint:"opcional, para ver o encaixe líder e liderado", ph:"S4D1-…", attr:'autocapitalize="characters" spellcheck="false"'})}
      ${t(v.lider) ? `<p class="note">${codeOk(t(v.lider)) ? "Código do líder válido." : '<span style="color:var(--e)">Código do líder inválido: confira a digitação.</span>'}</p>` : `<p class="note">O líder pode fazer o SELF para RH e copiar o “Código para o RH” do relatório.</p>`}</div></div></div>
    ${nav(1,"Próximo: candidatos")}</section>`;

/* ---------- tela 3: candidatos ---------- */
function candRow(c, kind){
  const sub = c.ok ? [c.posTitle, c.city, c.src==="pdf"?"PDF":c.src==="texto"?"WhatsApp":"código"].filter(Boolean).join(" · ") : `<span class="bad">${esc(c.erro||"Código não encontrado")}</span>`;

/* ---------- tela 4: análise ---------- */
const dots = n => `<span class="dots" aria-label="${["baixa","média","alta"][n]}">${[0,1,2].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
const byFaixa = {Alta:0, Boa:1, "Atenção":2};
function resCands(){ const p = P(); if(!p.res) return [];
  return p.res.candidatos.map(r=>Object.assign({}, r, p.cands.find(c=>c.id===r.id)||{})).filter(r=>r.nome!==undefined)
    .sort((a,b)=> byFaixa[a.faixa]-byFaixa[b.faixa] || t(a.nome).localeCompare(t(b.nome))); }
function screen3(){
  const p = P();
  if(!p.res) return `<section class="screen"><div class="eyebrow">Etapa 4 de 5 · Análise</div><h1>Analisando…</h1><p class="lead" id="anSt">Calculando a aderência de cada candidato à vaga.</p>${nav(3)}</section>`;
  const R = p.res, list = resCands();
  if(!p.ind || !list.find(x=>x.id===p.ind)) p.ind = list[0] && list[0].id;
  const alvo = R.alvo.map(a=>`<div class="prio"><b>${esc(a.label)}</b><p>${esc(a.desc)}</p>${a.razoes.length?`<small>Por quê: ${esc(a.razoes.join(", "))}</small>`:""}</div>`).join("");
  const tabs = [["ind","Individual"],["cmp","Comparar"],["time","Time"]].map(([k,l])=>`<button class="tab${p.tab===k?" on":""}" data-tab="${k}" role="tab" aria-selected="${p.tab===k}">${l}</button>`).join("");
  let body = "";
  if(p.tab==="ind") body = viewInd(list, R);
  else if(p.tab==="cmp") body = viewCmp(list, R);
  else body = viewTime(list, R);
  const errs = R.erros && R.erros.length ? `<p class="note">${R.erros.length} código(s) não puderam ser analisados.</p>` : "";
  return `<section class="screen"><div class="eyebrow">Etapa 4 de 5 · Análise</div><h1>${esc(vagaTitle(p.vaga))}: o que a vaga pede</h1>
    <p class="lead">As quatro prioridades abaixo saem do que você contou sobre o negócio e a vaga. Cada candidato é comparado com elas.</p>
    <div class="alvo">${alvo}</div>${errs}
    <div class="tabs" role="tablist">${tabs}</div>${body}
    ${nav(3,"Próximo: decisão")}</section>`;
}
function profileBlock(c){
  const pf = c.perfil;
  return `<div class="bars">${"DISC".split("").map(k=>`<div class="bar"><span>${DISC[k].nick}</span><span class="tr"><i style="width:${pf.pct[k]}%;background:${DISC[k].col}"></i></span><em>${pf.pct[k]}%</em></div>`).join("")}</div>
    <div class="kv"><div><small>Emoções</small><b>${esc(pf.ieCat)}</b></div><div><small>Locus</small><b>${esc(pf.lcCat)}</b></div><div><small>Motivação</small><b>${esc(pf.mot1?MOT[pf.mot1]:"-")}${pf.mot2?` <span style="color:var(--muted);font-weight:700">e ${MOT[pf.mot2]}</span>`:""}</b></div></div>`;
}
function viewInd(list, R){
  const p = P(), c = list.find(x=>x.id===p.ind);
  if(!c) return '<p class="empty">Nenhum candidato analisado.</p>';

  const edu = (c.edu||[]).map(e=>`${esc(e.course)}${e.school?` · ${esc(e.school)}`:""}${e.year?` (${esc(e.year)})`:""}`).join("<br>");

      <p style="margin-top:12px"><span class="band ${c.faixa}">Aderência ${c.faixa}</span> <b style="margin-left:6px">${esc(c.destaque)}</b></p>
      ${profileBlock(c)}
      <div class="sec-t">Nesta vaga</div><div class="plist">${R.alvo.map(a=>`<div class="pl"><span>${esc(a.label)}</span>${dots(c.nivel[a.key])}</div>`).join("")}</div>
      ${(exp||edu) ? `<div class="sec-t">Experiência e formação</div><p style="font-size:14.5px;margin-top:6px">${exp||"-"}</p>${edu?`<p style="font-size:14.5px;margin-top:6px;color:var(--muted)">${edu}</p>`:""}` : ""}
    </div><div class="card" style="margin-top:0">
      <div class="sec-t">Forças para esta vaga</div><ul class="li">${c.forcas.map(f=>`<li>${esc(f.texto)}</li>`).join("")}</ul>
      <div class="sec-t">Pontos a explorar na entrevista</div><ul class="li">${c.explorar.map(f=>`<li>${esc(f.texto)}</li>`).join("") || "<li>Nenhum ponto específico.</li>"}</ul>
      <div class="sec-t">Perguntas sugeridas</div><ol class="qs">${c.perguntas.map(q=>`<li>${esc(q)}</li>`).join("")}</ol>
      <div class="acts"><button class="btn sec small" data-act="copyq">${ICON.copy} Copiar perguntas</button></div>
      ${c.notas.length?`<div class="notas">${c.notas.map(n=>`<div>${esc(n)}</div>`).join("")}</div>`:""}
      ${field("note-"+c.id,"Anotações da entrevista","note."+c.id,p.notes[c.id]||"",{ta:true, hint:"ficam só neste aparelho", ph:"O que você observou na conversa…"})}
    </div></div>`;
}
function viewCmp(list, R){

  const keyd = R.alvo.map(a=>{ const top = sel.filter(x=>x.nivel[a.key]===2).map(x=>t(x.nome).split(" ")[0]);
    return `<div><b>${esc(a.label)}:</b> ${top.length ? esc(joinE(top)) + (top.length>1?" se destacam.":" se destaca.") : "ninguém se destaca; vale explorar na entrevista."}</div>`; }).join("");
  return `<p class="note">Escolha de 2 a 5 candidatos para ver lado a lado.</p><div class="selrow">${chips}</div>
    ${sel.length<2?'<p class="empty">Selecione pelo menos dois.</p>':`<div class="cmpwrap"><table class="cmp"><thead><tr><th>Candidato</th>${sel.map(x=>`<th>${esc(t(x.nome)||"?")}</th>`).join("")}</tr></thead><tbody>
      ${row("Aderência", x=>`<span class="band ${x.faixa}">${x.faixa}</span>`)}
      ${row("Destaque", x=>esc(x.destaque.replace(/^Destaque: /,"")))}

      ${row("Estilo", disc)}
      ${row("Emoções", x=>esc(x.perfil.ieCat))}
      ${row("Locus", x=>esc(x.perfil.lcCat))}
      ${row("Motivação", x=>esc(x.perfil.mot1?MOT[x.perfil.mot1]:"-"))}
      ${row("Explorar", x=>x.explorar.map(e=>esc(e.texto)).join("<br>")||"-")}
      ${row("Fez o SELF para", x=>esc(x.posTitle||"-"))}
      ${row("Experiência", x=>x.first?"Primeiro emprego":esc((x.exp||[]).map(e=>e.role).filter(Boolean).slice(0,2).join(", ")||"-"))}
    </tbody></table></div><div class="sec-t">Diferenças-chave</div><div class="keyd">${keyd}</div>`}`;
}
function viewTime(list, R){
  const p = P(), T = R.time;
  if(!T) return `<div class="card"><p class="empty">Carregue os PDFs ou códigos do time atual na etapa 3 para ver que estilos faltam no turno.</p><div style="text-align:center"><button class="btn sec small" data-go="2">Ir para candidatos</button></div></div>`;
  const bring = list.filter(x=>x.perfil.p1 && T.faltam.includes(x.perfil.p1));

let pdfjsP = null;
function pdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsP) return pdfjsP;
  pdfjsP = new Promise((res, rej)=>{ const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => { try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); }catch(e){ rej(e); } };
    s.onerror = () => { pdfjsP = null; rej(new Error("pdfjs")); }; document.head.appendChild(s); });
  return pdfjsP;
}
async function readPDF(file){
  const lib = await pdfjs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  try{
    const meta = await doc.getMetadata().catch(()=>null);
    const kw = meta && meta.info && meta.info.Keywords;
    if(kw && /^selfrh1:/.test(kw)){ try{ const m = JSON.parse(decodeURIComponent(kw.slice(8)));
      return {codigo:m.code, nome:m.name, phone:m.phone, email:m.email, city:m.city, posTitle:m.posTitle, exp:m.exp||[], edu:m.edu||[], first:!!m.first, why:m.why||[], src:"pdf"}; }catch(e){} }
    // PDFs anteriores à versão 1.11: lê o texto (rótulos vêm com letras espaçadas)
    const rows = [];
    for(let i=1;i<=Math.min(doc.numPages,4);i++){
      const pg = await doc.getPage(i), tc = await pg.getTextContent(), by = {};
      tc.items.forEach(it=>{ if(!t(it.str)) return; const y = Math.round(it.transform[5]); (by[y] = by[y] || []).push({x:it.transform[4], s:t(it.str)}); });
      Object.keys(by).map(Number).sort((a,b)=>b-a).forEach(y=>{ const items = by[y].sort((a,b)=>a.x-b.x); rows.push({items, txt:items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim()}); });
    }
    const flat = r => r.txt.replace(/\s+/g,"").toUpperCase();
    const at = lab => rows.findIndex(r=>flat(r).startsWith(lab));
    const txt = rows.map(r=>r.txt).join("\n"), code = (txt.match(CODE_RE)||[])[0] || "";
    let nome = "", ci = at("CANDIDATO(A)");
    if(ci>=0) for(let k=ci+1;k<Math.min(ci+4,rows.length);k++){ if(!/^N.VEL \d/i.test(rows[k].txt)){ nome = rows[k].txt; break; } }
    const phone = (txt.match(/WhatsApp\s+([+\d][\d\s().-]{7,}\d)/)||[])[1] || "";
    const vi = at("VAGADESEJADA"), vaga = vi>=0 && rows[vi+1] ? rows[vi+1].txt.replace(/\s*\(.*$/,"") : "";
    // tabela de experiência: colunas pela posição do cabeçalho
    const exp = []; let first = false;
    const ei = rows.findIndex(r=>/Empresa/.test(r.txt) && /Cargo/.test(r.txt));
    if(ei>=0){ const hx = rows[ei].items.map(i=>i.x);
      for(let k=ei+1;k<rows.length;k++){ const r = rows[k]; if(/^\d\s/.test(r.txt) || /Escola/.test(r.txt) || r.items.length<2) break;
        const cols = ["","",""]; r.items.forEach(it=>{ let c = 0; hx.forEach((x,j)=>{ if(it.x >= x-2) c = j; }); cols[Math.min(c,2)] = t(cols[Math.min(c,2)]+" "+it.s); });
        exp.push({company:cols[0], role:cols[1], tenure:cols[2]}); } }
    else if(/Primeiro emprego/i.test(txt)) first = true;
    return {codigo:code, nome:t(nome), phone:t(phone), posTitle:t(vaga), exp, first, edu:[], src:"pdf"};
  }finally{ try{ doc.destroy(); }catch(e){} }
}
function parseText(txt){
  const out = [], codes = [...new Set(String(txt).match(CODE_RE)||[])];
  const get = re => { const m = String(txt).match(re); return m ? t(m[1]).replace(/\*/g,"") : ""; };
  if(codes.length===1){
    const exp = []; const em = String(txt).match(/\*Experi[eê]ncia:\*\s*\n([\s\S]*?)(\n\s*\n|$)/);
    let first = false;
    if(em) em[1].split("\n").map(t).filter(Boolean).forEach(l=>{ if(/primeiro emprego/i.test(l)) first = true; else { const m = l.match(/^(.*?) na (.*?) \((.*)\)$/); exp.push(m?{role:m[1], company:m[2], tenure:m[3]}:{role:l}); } });
    out.push({codigo:codes[0], nome:get(/\*Nome:\*\s*(.+)/), phone:get(/\*WhatsApp:\*\s*(.+)/), email:get(/\*E-mail:\*\s*(.+)/), city:get(/\*Cidade:\*\s*([^·\n]+)/), posTitle:get(/\*Vaga:\*\s*(.+)/), exp, first, edu:[], src:"texto"});
  } else codes.forEach((c,i)=>out.push({codigo:c, nome:"", exp:[], edu:[], src:"codigo"}));
  return out;
}
function addParsed(list, items, kind){
  let added = 0, dup = 0;
  items.forEach(x=>{
    const c = Object.assign({id:uid(), addedAt:new Date().toISOString()}, x);
    c.codigo = t(c.codigo); c.ok = codeOk(c.codigo);
    if(!c.ok) c.erro = c.codigo ? "Código com dígito verificador inválido" : "Código SELF não encontrado no arquivo";
    if(!t(c.nome)) c.nome = (kind==="t" ? "Pessoa " : "Candidato ") + (list.length + 1);
    if(c.ok && list.find(y=>y.codigo===c.codigo && t(y.nome).toLowerCase()===t(c.nome).toLowerCase())){ dup++; return; }
    list.push(c); added++;
  });
  return {added, dup};
}
async function onFiles(files, kind){
  const p = P(), list = kind==="t" ? p.team : p.cands, st = $("#pdfSt");
  const arr = [...files].filter(f=>/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));

  if(st){ st.classList.remove("err"); st.textContent = `Lendo ${arr.length} arquivo${arr.length>1?"s":""}…`; }
  const items = [], fails = [];
  for(const f of arr){ try{ const r = await readPDF(f); r.file = f.name; items.push(r); }catch(e){ fails.push(f.name); } }

  track("rh_cand_add", {method:"pdf", kind:kind==="t"?"time":"candidato", n:r.added});
}

  if(d.data && d.esc.length){
    para(`Escolhido${d.esc.length>1?"s":""}: ${d.esc.map(id=>t((p.cands.find(c=>c.id===id)||{}).nome)).filter(Boolean).join(", ")}  ·  registrado em ${fmtD(d.data)}`, 10, RGB.ink, "bold");
    if(d.motivos.length) para("Motivos: " + d.motivos.join(", "), 9.5);
    if(t(d.texto)) para(t(d.texto), 9.5, RGB.muted);
    const fd = followDate(); if(fd) para(`Acompanhamento de 90 dias: ${fd.toLocaleDateString("pt-BR")}` + (Object.keys(d.follow).length ? " · " + d.esc.map(id=>{ const f = d.follow[id]; const c = p.cands.find(x=>x.id===id); return f && c ? `${t(c.nome)}: ${f==="ficou"?"continua":"saiu"}` : ""; }).filter(Boolean).join(", ") : ""), 9.5);
  } else para("Decisão ainda não registrada.", 9.5, RGB.muted);
  y += 4; para("Ferramenta de apoio à decisão. A aderência compara o perfil SELF de cada pessoa com as prioridades da vaga; não é nota, não substitui entrevista nem avaliação profissional e não decide sozinha uma contratação. Este relatório contém dados pessoais: guarde com cuidado e descarte quando não for mais necessário (LGPD).", 7.8, RGB.muted);
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); draw(RGB.line); doc.setLineWidth(.3); doc.line(M, H-14, W-M, H-14);
    doc.addImage(LOGO_DARK,"PNG",M,H-11.2,3.9,4.5,"dark","FAST"); font("bold",7.5); color(RGB.ink); doc.text("Proselling", M+5.5, H-7.8);
    font("normal",7.5); color(RGB.muted); doc.text(T(`  ·  ${PROGRAM} · ${EPISODE}  ·  ${dStr} ${hStr}`), M+5.5+doc.getTextWidth("Proselling")+.5, H-7.8);
    doc.text(T(`Página ${i} de ${n}`), W-M, H-7.8, {align:"right"}); }
  return doc;
}
window.__buildPDF = buildPDF;
async function saveFile(blob, filename, title){
  try{ const file = new File([blob], filename, {type:blob.type});
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:title||filename}); return "shared"; }catch(err){ if(err && err.name==="AbortError") return "cancel"; } }
  }catch(err){}
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return "saved";
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const slug = s => t(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "processo";
async function exportPDF(){
  const st = $("#pdfStatus"), btn = $("#pdfBtn"); const say = (m, err) => { if(st){ st.textContent = m; st.classList.toggle("err", !!err); } };
  if(!window.jspdf || !window.jspdf.jsPDF){ say("Não foi possível carregar o gerador de PDF. Verifique a conexão e recarregue a página.", true); return; }
  if(btn) btn.classList.add("busy"); say("Gerando PDF…");
  try{ const blob = buildPDF().output("blob");
    const r = await saveFile(blob, `RH-Selecao-${slug(vagaTitle(P().vaga))}-${stamp()}.pdf`, "Relatório RH Seleção");
    say(r==="cancel" ? "Envio cancelado." : r==="shared" ? "PDF compartilhado." : "PDF baixado na pasta de downloads."); track("rh_pdf", {method:r});
  }catch(e){ say("Não foi possível gerar o PDF.", true); }finally{ if(btn) btn.classList.remove("busy"); }
}
function summaryText(){
  const p = P(), R = p.res, list = resCands(), d = p.dec, L = [];
  L.push(`*${PROGRAM} · ${EPISODE}*`, `*Vaga:* ${vagaTitle(p.vaga)}${t(S.ctx.nome)?" · "+t(S.ctx.nome):""}`, "");
  if(R){ L.push("*O que a vaga pede:* " + R.alvo.map(a=>a.label).join(" · "), "");
    L.push("*Candidatos:*"); list.forEach(c=>L.push(`• ${t(c.nome)}: aderência ${c.faixa}. ${c.destaque}`)); L.push(""); }
  if(d.data && d.esc.length){ L.push(`*Escolhido${d.esc.length>1?"s":""}:* ${d.esc.map(id=>t((p.cands.find(c=>c.id===id)||{}).nome)).join(", ")}`);
    if(d.motivos.length) L.push("*Motivos:* " + d.motivos.join(", ")); if(t(d.texto)) L.push("_" + t(d.texto) + "_");
    const fd = followDate(); if(fd) L.push(`*Acompanhamento:* ${fd.toLocaleDateString("pt-BR")}`); }
  L.push("", "Resultado orientativo: apoia a decisão, não substitui a entrevista.");
  return L.join("\n");
}
async function copyText(txt, okMsg){ try{ await navigator.clipboard.writeText(txt); toast(okMsg); }catch(e){
  const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(okMsg); }catch(_){ toast("Não foi possível copiar.", true); } ta.remove(); } }

/* ---------- arquivo do processo ---------- */
function openMenu(btn){
  closeMenu(); const m = document.createElement("div"); m.className = "menu"; m.id = "menu"; m.setAttribute("role","menu");
  m.innerHTML = `<button data-act="export" role="menuitem">Exportar processos<small>Arquivo para backup ou outro aparelho</small></button>
    <button data-act="import" role="menuitem">Importar processos<small>Abrir um arquivo exportado</small></button>
    <button data-act="reset" role="menuitem">Apagar tudo deste aparelho<small>Negócio, vagas e candidatos</small></button>`;
  document.body.appendChild(m); setTimeout(()=>document.addEventListener("click", closeMenu, {once:true}), 0);
}
function closeMenu(){ const m = $("#menu"); if(m) m.remove(); }
async function exportData(){
  const blob = new Blob([JSON.stringify({app:"rhselecao", v:1, exported:new Date().toISOString(), data:S})], {type:"application/json"});
  const r = await saveFile(blob, `RH-Selecao-processos-${stamp()}.json`, "Processos RH Seleção"); if(r!=="cancel") toast("Arquivo exportado. Contém dados pessoais: guarde com cuidado."); track("rh_export");
}
async function importData(file){
  try{ const j = JSON.parse(await file.text()); const d = j && j.app==="rhselecao" ? j.data : null;
    if(!d || d.v!==1 || !Array.isArray(d.procs)) throw new Error("formato");
    if(!confirm("Importar substitui o que está neste aparelho. Continuar?")) return;
    S = d; save(); render(); toast("Processos importados."); track("rh_import");
  }catch(e){ toast("Arquivo inválido: escolha um arquivo exportado pelo RH Seleção.", true); }
}

/* ---------- voz para texto (mesmo padrão dos episódios) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, srBlocked = false, sheetSeen = false;
function micDecorate(){
  $$('#app input.inp:not([data-bind="vaga.lider"]), #app textarea.inp').forEach(el=>{
    if(el.parentElement.classList.contains("mic-wrap")) return;
    const w = document.createElement("span"); w.className = "mic-wrap"; el.parentNode.insertBefore(w, el); w.appendChild(el);
    const b = document.createElement("button"); b.type = "button"; b.className = "mic"; b.dataset.mic = el.id; b.setAttribute("aria-label","Falar em vez de digitar"); b.innerHTML = ICON.mic; w.appendChild(b);
  });
}
function micStart(id){
  const el = document.getElementById(id); if(!el) return;
  if(rec){ try{ rec.stop(); }catch(e){} return; }
  if(!SR || srBlocked) return dictHelp(el, true);
  let r; try{ r = new SR(); }catch(e){ srBlocked = true; return dictHelp(el, true); }
  r.lang = "pt-BR"; r.interimResults = true; r.continuous = false;
  const btn = document.querySelector(`[data-mic="${id}"]`), base = el.value ? el.value.replace(/\s*$/," ") : "";
  let got = false, done = false; const finish = () => { if(done) return; done = true; rec = null; if(btn) btn.classList.remove("rec"); };
  r.onresult = e => { let x = ""; for(const res of e.results) x += res[0].transcript; got = true; el.value = base + x; el.dispatchEvent(new Event("input",{bubbles:true})); };
  r.onerror = e => { const err = e && e.error; finish(); if(["not-allowed","service-not-allowed","audio-capture","network"].includes(err)){ srBlocked = true; if(!got) dictHelp(el, false); } else if(err==="no-speech") toast("Não ouvi nada. Toque no microfone e fale de novo.", true); };
  r.onend = () => { const was = !done; finish(); if(got && was) track("voice_input",{result:"speech"}); };
  setTimeout(()=>{ if(!done && !got){ try{ r.abort(); }catch(e){} finish(); srBlocked = true; if(document.body.contains(el) && !$("#sheetOv")) dictHelp(el, false); } }, 8000);
  try{ r.start(); rec = r; if(btn) btn.classList.add("rec"); }catch(e){ finish(); srBlocked = true; dictHelp(el, true); }
}
function dictHelp(el, inGesture){
  track("voice_input",{result:"keyboard_help"});
  if(sheetSeen && inGesture){ el.focus(); toast("Toque no microfone do teclado para falar", true); return; }
  sheetSeen = true; closeSheet();
  const ov = document.createElement("div"); ov.className = "sheet-ov"; ov.id = "sheetOv"; ov.dataset.target = el.id;
  ov.innerHTML = `<div class="sheet" role="dialog" aria-label="Falar pelo teclado"><h3>Fale pelo teclado</h3>
    <p>O ditado do teclado transforma sua voz em texto em qualquer campo. Toque no microfone do teclado e fale.</p>
    <ul><li>iPhone: microfone no canto inferior direito do teclado.</li><li>Android: microfone no topo ou ao lado da barra de espaço.</li><li>Computador: no Mac, tecla Fn duas vezes; no Windows, tecla Windows + H.</li></ul>
    <button class="btn" data-sheet="focus">Abrir o campo e falar</button><button class="btn ghost" data-sheet="close">Agora não</button></div>`;
  document.body.appendChild(ov);
}
function closeSheet(){ const o = $("#sheetOv"); if(o) o.remove(); }
let toastT;
function toast(html, warn){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const d = document.createElement("div"); d.className = "toast" + (warn?" warn":""); d.setAttribute("role","status"); d.innerHTML = html; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 3200); }

/* ---------- eventos ---------- */
function setPath(path, v){
  const p = P(), [root, key] = [path.split(".")[0], path.slice(path.indexOf(".")+1)];
  if(root==="ctx"){ S.ctx[key] = v; }
  else if(root==="vaga"){ p.vaga[key] = key==="lider" ? v.toUpperCase().replace(/\s+/g,"") : v; }
  else if(root==="note"){ p.notes[key] = v; return save(); }
  else if(root==="dec"){ p.dec[key] = v; return save(); }
  else return;
  invalidate(); save();
}
document.addEventListener("input", e=>{ const el = e.target.closest("[data-bind]"); if(!el) return; if(el.dataset.bind.startsWith("ui.")) return; setPath(el.dataset.bind, el.value); });
document.addEventListener("change", e=>{ const el = e.target.closest('[data-bind="vaga.lider"]'); if(el) setTimeout(()=>{ if(S.step===1 && document.activeElement!==el){ const y = scrollY; render(); scrollTo(0,y); } }, 0); });
document.addEventListener("click", e=>{
  const b = e.target.closest("button,[data-act]"); if(!b) return;
  const p = P(), ds = b.dataset;
  if(ds.mic){ return micStart(ds.mic); }
  if(ds.sheet){ const tgt = ($("#sheetOv")||{}).dataset; closeSheet(); if(ds.sheet==="focus" && tgt){ const el = document.getElementById(tgt.target); if(el) el.focus(); } return; }
  if(ds.go!==undefined){ return go(+ds.go); }
  if(ds.next!==undefined){ const i = +ds.next; if(!complete(i)) return showMissing(i); return go(i+1); }
  if(ds.chip){ const [root, key] = ds.chip.split("."), obj = root==="ctx" ? S.ctx : p.vaga, O = root==="ctx" ? OPT : VOPT, q = O[key];
    if(q.many){ const arr = obj[key] = obj[key] || []; const i = arr.indexOf(ds.v);
      if(i>=0) arr.splice(i,1); else { if(q.max && arr.length>=q.max) arr.shift(); arr.push(ds.v); } }
    else obj[key] = obj[key]===ds.v && !q.req ? "" : ds.v;
    invalidate(); save(); const y = scrollY; render(); scrollTo(0, y); return; }
  if(ds.qtd){ p.vaga.qtd = Math.max(1, Math.min(50, (p.vaga.qtd||1) + (+ds.qtd))); save(); const y = scrollY; render(); scrollTo(0,y); return; }
  if(ds.proc){ S.cur = ds.proc; save(); render(); return; }
  if(ds.del){ const [k, id] = ds.del.split(":"); const list = k==="t" ? p.team : p.cands; const i = list.findIndex(x=>x.id===id); if(i>=0) list.splice(i,1);
    p.dec.esc = p.dec.esc.filter(x=>x!==id); p.sel = p.sel.filter(x=>x!==id); invalidate(); save(); render(); return; }
  if(ds.tab){ p.tab = ds.tab; save(); render(); if(ds.tab==="cmp") track("rh_compare"); return; }
  if(ds.ind){ p.ind = ds.ind; save(); const y = scrollY; render(); scrollTo(0,y); return; }
  if(ds.sel){ const i = p.sel.indexOf(ds.sel); if(i>=0) p.sel.splice(i,1); else { if(p.sel.length>=5) p.sel.shift(); p.sel.push(ds.sel); } save(); const y = scrollY; render(); scrollTo(0,y); return; }
  if(ds.esc){ if(p.dec.data) return toast("Reabra a decisão para mudar a escolha.", true); const i = p.dec.esc.indexOf(ds.esc); if(i>=0) p.dec.esc.splice(i,1); else { if(p.dec.esc.length >= (p.vaga.qtd||1)) p.dec.esc.shift(); p.dec.esc.push(ds.esc); } save(); const y = scrollY; render(); scrollTo(0,y); return; }
  if(ds.mot){ const i = p.dec.motivos.indexOf(ds.mot); if(i>=0) p.dec.motivos.splice(i,1); else p.dec.motivos.push(ds.mot); save(); const y = scrollY; render(); scrollTo(0,y); return; }
  if(ds.follow){ p.dec.follow[ds.follow] = ds.v; save(); render(); track("rh_follow", {result:ds.v}); return; }
  switch(ds.act){
    case "cover": showCover = true; render(); scrollTo(0,0); return;
    case "start": case "startnew": showCover = false; try{ sessionStorage.setItem("rh-cover","1"); }catch(e){}
      if(ds.act==="startnew"){ const np = blankProc(); S.procs.push(np); S.cur = np.id; S.step = complete(0) ? 1 : 0; save(); }
      track("rh_start", {novo:ds.act==="startnew"}); render(); scrollTo(0,0); return;
    case "menu": e.stopPropagation(); return $("#menu") ? closeMenu() : openMenu(b);
    case "export": closeMenu(); return exportData();
    case "import": closeMenu(); return $("#impIn").click();
    case "reset": closeMenu(); if(confirm("Apagar negócio, vagas e candidatos deste aparelho? Exporte antes se quiser guardar.")){ S = blank(); save(); render(); track("rh_reset"); } return;
    case "pick": return $("#pdfIn").click();
    case "pickteam": return $("#teamIn").click();
    case "paste": { const el = $("#paste"), items = parseText(el.value); if(!items.length) return toast("Não encontrei um código S4D1 no texto.", true);
      const r = addParsed(p.cands, items, "c"); invalidate(); save(); render(); toast(r.added ? `${r.added} candidato${r.added>1?"s":""} adicionado${r.added>1?"s":""}.` : "Esse candidato já estava na lista."); track("rh_cand_add",{method:"texto", n:r.added}); return; }
    case "pasteteam": { const el = $("#pasteTeam"), items = parseText(el.value); if(!items.length) return toast("Não encontrei códigos S4D1.", true);
      const r = addParsed(p.team, items.map(x=>Object.assign(x,{src:"codigo"})), "t"); invalidate(); save(); render(); toast(`${r.added} pessoa${r.added===1?"":"s"} do time adicionada${r.added===1?"":"s"}.`); track("rh_cand_add",{method:"texto", kind:"time", n:r.added}); return; }
    case "newproc": { const np = blankProc(); S.procs.push(np); S.cur = np.id; save(); render(); toast("Novo processo criado."); track("rh_new_process"); return; }
    case "delproc": if(S.procs.length>1 && confirm(`Excluir o processo “${vagaTitle(p.vaga)}” e seus candidatos?`)){ S.procs = S.procs.filter(x=>x.id!==p.id); S.cur = S.procs[0].id; save(); render(); } return;
    case "retry": return analyze(true);
    case "copyq": { const c = resCands().find(x=>x.id===p.ind); if(c) copyText(c.perguntas.map((q,i)=>`${i+1}. ${q}`).join("\n"), "Perguntas copiadas."); return; }
    case "decide": if(!p.dec.esc.length) return toast("Escolha pelo menos um candidato.", true); p.dec.data = new Date().toISOString(); save(); render(); toast("Decisão registrada. Lembrete de 90 dias criado."); track("rh_decision", {escolhidos:p.dec.esc.length}); return;
    case "undec": p.dec.data = ""; save(); render(); return;
    case "pdf": return exportPDF();
    case "wa": track("rh_whatsapp"); window.open("https://wa.me/?text=" + encodeURIComponent(summaryText()), "_blank", "noopener"); return;
    case "copysum": track("rh_copy"); return copyText(summaryText(), "Resumo copiado.");
  }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.closest && e.target.closest(".brand")){ e.preventDefault(); showCover = true; render(); return; } if((e.key==="Enter"||e.key===" ") && e.target.id==="drop"){ e.preventDefault(); $("#pdfIn").click(); } if(e.key==="Escape"){ closeMenu(); closeSheet(); } });
$("#pdfIn").addEventListener("change", e=>{ const f = e.target.files; if(f && f.length) onFiles(f, "c"); e.target.value = ""; });
$("#teamIn").addEventListener("change", e=>{ const f = e.target.files; if(f && f.length) onFiles(f, "t"); e.target.value = ""; });
$("#impIn").addEventListener("change", e=>{ const f = e.target.files && e.target.files[0]; if(f) importData(f); e.target.value = ""; });
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev, e=>{ const d = e.target.closest && e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } }));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev, e=>{ const d = e.target.closest && e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.remove("over"); if(ev==="drop" && e.dataTransfer && e.dataTransfer.files.length) onFiles(e.dataTransfer.files, "c"); } }));
document.addEventListener("dragover", e=>e.preventDefault()); document.addEventListener("drop", e=>e.preventDefault());

$("#lgMark").src = LOGO_MARK; $("#lgWord").src = LOGO_WORD;
render();
track("rh_open", {processos:S.procs.length});
})();
</script>
