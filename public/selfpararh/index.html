<style>
/* Layout: tela de jogo mobile-first — HUD fixo no topo, mapa de fases, uma fase por tela com botões “3D” */
:root{
  color-scheme:dark;
  --bg:#15122E; --surface:#221D4A; --surface2:#2D2762; --line:#3E3680;
  --fg:#F4F1FF; --muted:#ABA4D6; --dim:#7D75B2; --ink:#1A1433;
  --f:#FFC93C; --f-d:#B8841A;
  --d:#3DD6F5; --d-d:#1C8FAB;
  --e:#FF5C7A; --e-d:#B42A47;
  --m:#8BE36A; --m-d:#4E9A35;
  --font-display:"Bungee","Arial Black",Impact,sans-serif;
  --font-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{
  font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:0 48px;
  background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,255,255,.055) 1px,transparent 0) 0 0/22px 22px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--d);outline-offset:2px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px 12px;
  background:linear-gradient(var(--bg) 70%,rgba(21,18,46,0));}
.hud-row{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.lvl{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--f);color:var(--ink);
  font-family:var(--font-display);font-size:18px;box-shadow:0 4px 0 var(--f-d);line-height:1}
.lvl small{display:block;font-family:var(--font-body);font-weight:900;font-size:9px;letter-spacing:.08em}
.xpbox{flex:1;min-width:0}
.rank{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rank span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rank span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:5px;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--m),var(--d));transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.clock{flex:none;display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:12px;background:var(--surface);border:2px solid var(--line);
  font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums}
.clock svg{width:18px;height:18px}
.xpfloat{position:fixed;z-index:50;left:50%;top:70px;transform:translateX(-50%);font-family:var(--font-display);font-size:22px;color:var(--m);
  text-shadow:0 3px 0 var(--ink);pointer-events:none;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

/* mapa de fases */
.map{max-width:620px;margin:6px auto 18px;position:relative;display:flex;justify-content:space-between;align-items:center}
.map::before{content:"";position:absolute;left:20px;right:20px;top:50%;height:4px;margin-top:-2px;background:var(--surface2);border-radius:4px}
.map .prog{position:absolute;left:20px;top:50%;height:4px;margin-top:-2px;background:var(--m);border-radius:4px;transition:width .5s}
.node{position:relative;width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-family:var(--font-display);font-size:15px;color:var(--muted);transition:transform .15s}
.node.open{border-color:var(--d);color:var(--fg)}
.node.done{background:var(--m);border-color:var(--m);color:var(--ink)}
.node.cur{transform:scale(1.18);box-shadow:0 0 0 5px rgba(61,214,245,.25)}
.node.done.cur{box-shadow:0 0 0 5px rgba(139,227,106,.3)}
.node:disabled{opacity:.45;cursor:not-allowed}
.node svg{width:18px;height:18px}

/* cartão de fase */
.stage{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.eyebrow{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--d)}
.stage h2{font-size:clamp(24px,7vw,32px);line-height:1.1;margin:6px 0 10px}
.intro{color:var(--muted);font-size:15px;max-width:60ch}
.quest{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:14px;font-weight:700}
.quest .chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--dim);display:grid;place-items:center}
.quest.ok .chk{background:var(--m);border-color:var(--m);color:var(--ink)}
.quest .chk svg{width:14px;height:14px;opacity:0}
.quest.ok .chk svg{opacity:1}
.quest .rw{margin-left:auto;font-family:var(--font-display);font-size:13px;color:var(--f)}
.body{margin-top:20px;display:grid;gap:14px}

label.fld{display:grid;gap:6px}
.fld>span{font-weight:800;font-size:14px}
.fld>span em{font-style:normal;font-weight:600;color:var(--dim)}
input,textarea{width:100%;font:inherit;font-weight:700;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s,background .15s}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--dim);font-weight:600}
input:focus,textarea:focus{outline:none;border-color:var(--d);background:#100D26}
input.filled,textarea.filled{border-color:var(--m-d)}
input[type=date]{min-height:50px;display:block;-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left;line-height:1.25}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.7}
input,textarea{min-width:0;max-width:100%}
.fld{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:800;padding:6px 12px;border-radius:99px;background:var(--surface2);color:var(--muted);border:none}
.chip:hover{color:var(--fg)}

/* botões */
.btn{border:none;border-radius:16px;padding:14px 20px;font-weight:900;font-size:16px;letter-spacing:.02em;text-transform:uppercase;
  background:var(--f);color:var(--ink);box-shadow:0 5px 0 var(--f-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--f-d)}
.btn:disabled{background:var(--surface2);color:var(--dim);box-shadow:0 5px 0 #1E1A44;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 5px 0 #1E1A44}
.btn.ghost:active{box-shadow:0 1px 0 #1E1A44}
.btn.small{padding:10px 14px;font-size:13px;border-radius:12px}
.btn.yes{background:var(--m);box-shadow:0 5px 0 var(--m-d)}
.btn.no{background:var(--e);box-shadow:0 5px 0 var(--e-d);color:#fff}
.btn.yes:active{box-shadow:0 1px 0 var(--m-d)} .btn.no:active{box-shadow:0 1px 0 var(--e-d)}
.nav{display:flex;gap:12px;margin-top:22px}
.nav .btn:last-child{flex:1}

/* arsenal */
.slots{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.slots{grid-template-columns:1fr 1fr}}
.slot{display:flex;align-items:center;gap:10px}
.slot b{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-family:var(--font-display);font-weight:400;font-size:14px;color:var(--muted);transition:.2s}
.slot.on b{background:var(--d);color:var(--ink)}
.slot input{min-width:0}

/* rotina */
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h3{font-size:17px}
.sec-h .tot{font-weight:800;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sec-h .tot strong{font-family:var(--font-display);font-weight:400;color:var(--fg);font-size:16px}
.row{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;align-items:center}
.row input{padding:11px 12px}
.row .h{text-align:center;font-variant-numeric:tabular-nums}
.x{width:40px;height:40px;border-radius:12px;border:none;background:var(--surface2);color:var(--dim);display:grid;place-items:center}
.x:hover{color:var(--e)}
.x svg{width:16px;height:16px}
.unit{font-size:12px;font-weight:800;color:var(--dim);text-align:center;margin-top:-4px}
.add{border:2px dashed var(--line);background:none;border-radius:14px;padding:11px;font-weight:800;color:var(--muted)}
.add:hover{border-color:var(--d);color:var(--fg)}

/* badges FDEM */
.bd{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;font-family:var(--font-display);font-size:17px;color:var(--ink);line-height:1}
.bd.F{background:var(--f);box-shadow:0 3px 0 var(--f-d)} .bd.D{background:var(--d);box-shadow:0 3px 0 var(--d-d)}
.bd.E{background:var(--e);box-shadow:0 3px 0 var(--e-d)} .bd.M{background:var(--m);box-shadow:0 3px 0 var(--m-d)}
.bd.big{width:96px;height:96px;border-radius:26px;font-size:52px;box-shadow:0 7px 0 rgba(0,0,0,.3)}

/* classificação */
.arena{background:var(--bg);border:2px solid var(--line);border-radius:22px;padding:20px 16px;text-align:center;display:grid;gap:14px;justify-items:center}
.deck{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card-act{font-family:var(--font-display);font-size:clamp(20px,6vw,26px);line-height:1.15;max-width:100%;overflow-wrap:anywhere}
.card-h{font-weight:800;color:var(--muted);font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:6px;background:var(--surface2)}
.dots i.on{background:var(--d)}
.q{font-weight:900;font-size:19px;line-height:1.3;max-width:34ch}
.q small{display:block;font-weight:700;font-size:13px;color:var(--dim);margin-top:6px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
.cat-name{font-family:var(--font-display);font-size:22px}
.cat-desc{color:var(--muted);font-size:14px;max-width:44ch}
.dist{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.dist i{display:block;height:100%;transition:width .4s}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.leg{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface2);font-size:13px;font-weight:700;min-width:0}
.leg .bd{width:28px;height:28px;font-size:14px;border-radius:8px}
.leg span{min-width:0}
.leg b{display:block;font-weight:900}
.leg em{font-style:normal;color:var(--muted);font-family:var(--font-display);font-size:14px}
.list{display:grid;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:none;text-align:left;width:100%}
.it .nm{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.it .hh{font-weight:800;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .bd{width:30px;height:30px;font-size:15px}
.it .bd.none{background:var(--bg);color:var(--dim);box-shadow:none;border:2px dashed var(--line)}
.hint{font-size:13px;color:var(--dim);font-weight:700}

/* plano */
.mission{border-radius:18px;background:var(--bg);border:2px solid var(--line);padding:14px;display:grid;gap:10px}
.mission.ok{border-color:var(--m-d)}
.mission-h{display:flex;align-items:center;gap:10px}
.mission-h .nm{flex:1;min-width:0;font-weight:900;overflow-wrap:anywhere}
.mission-h .tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.split>*,.kpi>div{min-width:0}
@media (max-width:350px){.split{grid-template-columns:1fr}}
.mini{font-size:12px;font-weight:800;color:var(--dim);margin-bottom:-4px}

/* recompensa */
.treasure{text-align:center;padding:22px 16px;border-radius:22px;background:var(--bg);border:2px solid var(--f-d);display:grid;gap:6px;justify-items:center}
.treasure .num{font-family:var(--font-display);font-size:clamp(54px,18vw,84px);line-height:1;color:var(--f);text-shadow:0 5px 0 var(--f-d);font-variant-numeric:tabular-nums}
.treasure .lab{font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.treasure .sub{color:var(--muted);font-size:14px;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px;border-radius:14px;background:var(--surface2);display:flex;gap:10px;align-items:center}
.kpi strong{font-family:var(--font-display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:800}
.kpi .bd{display:inline-grid;width:30px;height:30px;font-size:15px;color:var(--ink)}

/* troféu & boas-vindas */
.hero{text-align:center;padding:12px 0 4px;display:grid;gap:12px;justify-items:center}
.hero h1{font-size:clamp(40px,13vw,64px);line-height:.95}
.hero h1 span{display:block;font-size:.42em;color:var(--d);letter-spacing:.06em}
.letters{display:flex;gap:10px;justify-content:center;margin:6px 0}
.letters .bd{width:58px;height:58px;font-size:30px;border-radius:16px;animation:bob 2.4s ease-in-out infinite}
.letters .bd:nth-child(2){animation-delay:.2s}.letters .bd:nth-child(3){animation-delay:.4s}.letters .bd:nth-child(4){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.cats{display:grid;gap:10px;margin-top:8px}
.cat{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface2)}
.cat b{display:block;font-weight:900}
.cat p{font-size:14px;color:var(--muted)}
.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.trophy{width:120px;height:120px}
.sumcard{border-radius:18px;background:var(--bg);border:2px solid var(--line);padding:16px;display:grid;gap:12px;text-align:left}
.sumcard dt{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.sumcard dd{margin:2px 0 0;font-weight:800;overflow-wrap:anywhere}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{padding:10px 6px;border-radius:14px;background:var(--surface2);text-align:center;font-size:12px;font-weight:900;opacity:.35;display:grid;gap:4px;justify-items:center}
.ach.on{opacity:1;background:var(--surface2);box-shadow:inset 0 0 0 2px var(--f)}
.ach svg{width:26px;height:26px;color:var(--f)}
.ach .qk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ach .qv{font-family:var(--font-display);font-weight:400;font-size:clamp(11.5px,3.6vw,14px);line-height:1.15;color:var(--fg);overflow-wrap:normal;hyphens:auto}
@media(max-width:380px){.ach:not(.q-ok) .qv{font-family:var(--font-body);font-weight:900;font-size:13.5px;letter-spacing:0}}
.ach.long{grid-column:1/-1;padding:12px 14px}.ach.long .qv{font-family:var(--font-body);font-weight:800;font-size:15px;line-height:1.35}
.ach.q-ok{grid-column:span 2;grid-template-columns:auto auto;align-items:center;justify-content:center;column-gap:10px}.ach.q-ok svg{grid-row:span 2}
.ach.q-d{box-shadow:inset 0 0 0 2px var(--d)} .ach.q-d svg{color:var(--d)}
.ach.q-e{box-shadow:inset 0 0 0 2px var(--e)} .ach.q-e svg{color:var(--e)}
.ach.q-m{box-shadow:inset 0 0 0 2px var(--m)} .ach.q-m svg{color:var(--m)}
.ach.q-v{box-shadow:inset 0 0 0 2px #9B7BFF} .ach.q-v svg{color:#9B7BFF}
.ach.q-ok{background:var(--m);box-shadow:0 4px 0 var(--m-d)} .ach.q-ok svg{color:var(--ink)} .ach.q-ok .qk{color:var(--ink);opacity:.7} .ach.q-ok .qv{color:var(--ink);font-size:clamp(13px,3.8vw,16px);line-height:1.2;text-align:left}
.copyarea{width:100%;min-height:180px;font-size:13px;font-weight:600}
.ver{display:inline-block;margin-top:6px;font-variant-numeric:tabular-nums;opacity:.85}
.hub-link{display:inline-block;margin-bottom:14px;padding:10px 16px;border-radius:12px;background:var(--surface);border:2px solid var(--line);color:var(--fg);font-weight:900;font-size:13px;text-decoration:none}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:24px;font-weight:600}

/* toast & confetti */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--m);color:var(--ink);font-weight:900;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--m-d);
  display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);animation:toastIn .35s cubic-bezier(.2,1.3,.4,1)}
.toast.warn{background:var(--f);box-shadow:0 5px 0 var(--f-d)}
.btn.locked{background:var(--surface2);color:var(--muted);box-shadow:0 5px 0 #1E1A44}
.node.lockedn{opacity:.45}
input.need,textarea.need{border-color:var(--f);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.toast b{font-family:var(--font-display);font-weight:400}
@keyframes toastIn{from{transform:translate(-50%,40px);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* abertura */
.splash{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--bg) radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0) 0 0/22px 22px;transition:opacity .5s,transform .5s;cursor:pointer}
.splash::before{content:"";position:absolute;width:520px;height:520px;max-width:140vw;max-height:140vw;border-radius:50%;left:50%;top:42%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(61,214,245,.22),rgba(255,201,60,.08) 55%,transparent);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.75}}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp{position:relative;display:grid;gap:22px;justify-items:center;text-align:center;width:100%;max-width:420px}
.sp-logo{display:flex;align-items:center;gap:10px;height:54px}
.sp-logo img{height:54px;width:auto;max-width:none}
.sp-mark{animation:markIn .9s cubic-bezier(.2,1.4,.4,1) .15s both}
.sp-word{animation:wordIn .7s cubic-bezier(.2,.9,.3,1) .7s both}
@keyframes markIn{0%{opacity:0;transform:scale(.2) rotate(-120deg)}100%{opacity:1;transform:none}}
@keyframes wordIn{0%{opacity:0;transform:translateX(-24px);clip-path:inset(0 100% 0 0)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.sp-prog{display:grid;gap:6px;justify-items:center}
.sp-kicker{font-weight:900;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:fadeUp .5s 1.1s both}
.sp-title{font-family:var(--font-display);font-size:clamp(42px,13vw,66px);line-height:.95;color:var(--fg);text-shadow:0 5px 0 rgba(0,0,0,.35)}
.sp-title span{display:inline-block;animation:letterIn .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes letterIn{0%{opacity:0;transform:translateY(30px) scale(.4) rotate(12deg)}100%{opacity:1;transform:none}}
.sp-stroke{width:min(320px,86%);height:auto;overflow:visible;margin-top:-4px}
.sp-stroke path{fill:none;stroke:url(#penGrad);stroke-width:7;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:0;animation:draw 1s cubic-bezier(.6,0,.3,1) 2s both}
.sp-stroke circle{fill:var(--fg);opacity:0;animation:dotIn .3s ease 2.9s forwards,twinkle 1.6s ease-in-out 3.3s infinite}
@keyframes dotIn{from{opacity:0}to{opacity:1}}
@keyframes draw{0%{stroke-dashoffset:420}100%{stroke-dashoffset:0}}
@keyframes twinkle{0%,100%{opacity:1;transform-origin:center}50%{opacity:.2}}
.sp-ep{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:99px;background:var(--surface);border:2px solid var(--line);animation:fadeUp .5s 2.8s both}
.sp-ep span{font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--d)}
.sp-ep b{font-family:var(--font-display);font-weight:400;font-size:16px;padding:6px 12px;border-radius:99px;background:var(--f);color:var(--ink)}
.sp .letters .bd{width:46px;height:46px;font-size:24px;border-radius:13px}
.sp .letters{animation:fadeUp .5s 3.1s both;margin:0}
.sp .btn{min-width:220px;animation:fadeUp .5s 3.4s both}
.sp-tap{font-size:12px;font-weight:800;color:var(--dim);animation:fadeUp .5s 3.6s both}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.brand img{height:20px;width:auto;opacity:.75}
.hero .program{font-weight:900;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.export{display:grid;gap:12px;padding:16px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.export h3{font-size:16px}
.btn.wa{background:#25D366;color:#0B2E1A;box-shadow:0 5px 0 #168A42;text-decoration:none}
.btn.wa:active{box-shadow:0 1px 0 #168A42}
.btn.wide{width:100%}
.status{font-size:13px;font-weight:700;color:var(--muted)}
.status.err{color:var(--e)}

/* som */
.snd{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0}
.snd svg{width:20px;height:20px}
.snd.off{color:var(--dim)}
.chip.sndchip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.sndchip svg{width:15px;height:15px}

/* microfone */
.mic-wrap{position:relative;display:block;width:100%;min-width:0}
.slot .mic-wrap{flex:1}
.mic-wrap>input,.mic-wrap>textarea{padding-right:48px}
.mic{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;border:none;background:var(--surface2);color:var(--muted);display:grid;place-items:center;padding:0}
.mic svg{width:18px;height:18px}
.mic:hover{color:var(--fg)}
.mic-wrap.ta .mic{top:8px;transform:none}
.dict-hint{position:fixed;z-index:70;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);
  display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--d);color:var(--ink);font-weight:800;font-size:14px;line-height:1.3;
  box-shadow:0 5px 0 var(--d-d);animation:toastIn .3s cubic-bezier(.2,1.3,.4,1)}
.dict-hint svg{flex:none;width:20px;height:20px}
.mic.rec{background:var(--e);color:#fff;animation:micPulse 1s infinite}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(255,92,122,.6)}100%{box-shadow:0 0 0 12px rgba(255,92,122,0)}}
.sheet-ov{position:fixed;inset:0;z-index:88;background:rgba(10,8,25,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border:2px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:sheetIn .3s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{transform:translateY(100%)}}
.sheet h3{font-size:20px}
.sheet p{color:var(--muted);font-size:15px}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:6px;font-weight:700;font-size:14px}
.kbd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px;border-radius:14px;background:var(--bg)}
.kbd i{height:28px;border-radius:6px;background:var(--surface2)}
.kbd i.sp{grid-column:span 4}
.kbd i.mk{background:var(--d);color:var(--ink);display:grid;place-items:center;animation:micPulse 1.2s infinite}
.kbd i.mk svg{width:16px;height:16px}

/* opções de relatório */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;
  box-shadow:0 4px 0 #1E1A44;transition:transform .08s,box-shadow .08s,border-color .15s;font:inherit;width:100%}
.opt:hover{border-color:var(--d)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #1E1A44}
.opt .oi{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.opt .oi svg{width:24px;height:24px}
.opt b{display:block;font-weight:900;font-size:16px}
.opt span.od{display:block;font-size:13px;color:var(--muted);font-weight:700;line-height:1.35}
.opt .on{font-family:var(--font-display);font-size:13px;color:var(--dim);margin-left:auto;flex:none}
.opt.busy{opacity:.6;pointer-events:none}

/* relatório na tela */
.rc-ov{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
.rc{position:relative;flex:0 1 auto;min-height:0;width:100%;max-width:430px;border-radius:22px;overflow:hidden;background:var(--bg);border:2px solid var(--line);
  display:flex;flex-direction:column;gap:clamp(6px,1.25vh,12px);padding:clamp(12px,2.1vh,20px) 16px clamp(14px,2.2vh,20px);font-size:clamp(11px,1.72vh,15px);cursor:pointer}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-top .lg{display:flex;gap:6px;align-items:center}
.rc-top img{height:clamp(16px,2.5vh,22px);width:auto;max-width:none}
.rc-top .dt{font-weight:800;color:var(--muted);font-size:.82em;text-align:right;line-height:1.25}
.rc-title .k{font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--d);font-size:.72em}
.rc-title h3{font-family:var(--font-display);font-weight:400;font-size:2.05em;line-height:1.05}
.rc-who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-who b{font-weight:900;font-size:1.08em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-pill{flex:none;font-weight:900;font-size:.76em;padding:.35em .8em;border-radius:99px;background:var(--f);color:var(--ink);white-space:nowrap}
.rc-hero{display:flex;align-items:center;gap:14px;padding:clamp(8px,1.5vh,14px) 14px;border-radius:16px;background:var(--surface);border:2px solid var(--f-d)}
.rc-hero .n{font-family:var(--font-display);font-size:2.8em;line-height:1;color:var(--f);text-shadow:0 4px 0 var(--f-d);flex:none}
.rc-hero p{font-weight:900;line-height:1.25}
.rc-hero small{display:block;color:var(--muted);font-weight:700;font-size:.85em}
.rc .dist{height:.75em}
.rc-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rc-k div{display:flex;align-items:center;gap:6px;padding:.45em;border-radius:12px;background:var(--surface);min-width:0}
.rc-k .bd{width:1.8em;height:1.8em;font-size:.95em;border-radius:7px;box-shadow:none}
.rc-k span{font-weight:900;font-size:.88em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-l{font-size:.7em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rc-v{font-weight:800;line-height:1.3;overflow:hidden;max-height:2.6em;overflow-wrap:anywhere}
.rc-sec{display:grid;gap:2px}
.rc-plan{display:grid;gap:5px}
.rc-plan div{display:flex;gap:8px;align-items:center;min-width:0}
.rc-plan .bd{width:1.7em;height:1.7em;font-size:.9em;border-radius:6px;box-shadow:none}
.rc-plan span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rc-plan span b{font-weight:900}
.rc-plan em{font-style:normal;font-size:.8em;color:var(--dim);font-weight:800}
.rc-two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.rc-two>*{min-width:0}
.rc-foot{margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7em;font-weight:800;color:var(--dim)}
.rc-strip{position:absolute;left:0;right:0;bottom:0;height:6px;display:flex}
.rc-strip i{flex:1}
.rc-bar{display:flex;gap:10px;width:100%;max-width:430px}
.rc-bar .btn{flex:1;padding:12px 10px;font-size:14px}
.rc-hint{font-size:12px;font-weight:700;color:var(--dim);text-align:center;max-width:430px}
.rc-hint.err{color:var(--e)}
.rc-ov.clean .rc-bar,.rc-ov.clean .rc-hint{display:none}
@media (max-height:640px){
  .rc{font-size:clamp(10px,1.62vh,13px);gap:5px;padding:10px 14px 14px}
  .rc-hero{padding:6px 12px}
  .rc-hero small{font-size:.8em}
  .rc-hint{display:none}
  .rc-bar .btn{padding:10px;font-size:13px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- SELF para RH ---------- */
.bd.cf{background:var(--f);box-shadow:0 3px 0 var(--f-d)} .bd.cd{background:var(--d);box-shadow:0 3px 0 var(--d-d)}
.bd.ce{background:var(--e);box-shadow:0 3px 0 var(--e-d)} .bd.cm{background:var(--m);box-shadow:0 3px 0 var(--m-d)}
.hero h1 span.after{margin-top:4px}
/* carrossel de posições */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-18px;padding:6px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.pos{flex:0 0 84%;max-width:360px;scroll-snap-align:center;border-radius:20px;background:var(--bg);border:2px solid var(--line);padding:14px;display:grid;gap:10px;align-content:start;text-align:left;color:var(--fg);font:inherit;transition:border-color .15s,box-shadow .15s}
.pos.sel{border-color:var(--m);box-shadow:0 0 0 4px rgba(139,227,106,.22)}
.pos .pa{height:118px;border-radius:14px;overflow:hidden;display:block}
.pos .pa svg{width:100%;height:100%;display:block}
.pos .pt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pos h3{font-size:19px;line-height:1.1}
.pos .tg{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pos p{font-size:14px;color:var(--muted);font-weight:700}
.pos ul{margin:0;padding-left:18px;font-size:13.5px;font-weight:700;display:grid;gap:3px}
.pos .chips .chip{font-size:12px;padding:4px 10px;background:var(--surface2)}
.pos .btn{width:100%}
.pos.sel .btn{background:var(--m);box-shadow:0 5px 0 var(--m-d)}
.cdots{display:flex;gap:8px;justify-content:center}
.cdots button{width:10px;height:10px;padding:0;border-radius:99px;border:none;background:var(--surface2);transition:width .2s,background .2s}
.cdots button.on{width:26px;background:var(--d)}
/* motivos */
.chip.pick{padding:9px 14px;font-size:14px;border:2px solid transparent}
.chip.pick.on{background:var(--d);color:var(--ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--bg);border:2px dashed var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.note svg{flex:none;width:18px;height:18px;color:var(--d);margin-top:1px}
/* avaliação */
.sit{font-weight:800;font-size:17px;line-height:1.35;max-width:40ch}
.ansl{display:grid;gap:10px;width:100%;text-align:left}
.ans{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit;font-weight:800;font-size:15px;line-height:1.3;text-align:left;
  box-shadow:0 4px 0 #1E1A44;transition:transform .08s,box-shadow .08s,border-color .15s}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 #1E1A44}
.ans b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-family:var(--font-display);font-weight:400;font-size:14px;color:var(--muted)}
.ans.sel{border-color:var(--m)} .ans.sel b{background:var(--m);color:var(--ink)}
.qlist .it .bd{font-size:13px}
/* experiência e formação */
.tog{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit;font-weight:800;text-align:left}
.tog .chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--dim);display:grid;place-items:center}
.tog .chk svg{width:15px;height:15px;opacity:0}
.tog.on{border-color:var(--m-d)} .tog.on .chk{background:var(--m);border-color:var(--m);color:var(--ink)} .tog.on .chk svg{opacity:1}
.three{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three>*{min-width:0}
/* perfil */
.meter{display:grid;gap:9px}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) 46px;gap:10px;align-items:center}
.mrow .bd{width:30px;height:30px;font-size:15px}
.mrow .ml{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mbar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.mrow .mp{font-family:var(--font-display);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.k3 div{padding:10px;border-radius:14px;background:var(--surface2);min-width:0}
.k3 span{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.k3 strong{display:block;font-family:var(--font-display);font-weight:400;font-size:15px;line-height:1.15;margin-top:3px;overflow-wrap:anywhere}
.k3 em{display:block;font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
@media (max-width:360px){.k3{grid-template-columns:1fr}}
.disc{font-size:12.5px;color:var(--dim);font-weight:700;text-align:center}
.rc-disc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rc-disc div{display:flex;align-items:center;gap:6px;padding:.45em;border-radius:12px;background:var(--surface);min-width:0}
.rc-disc .bd{width:1.8em;height:1.8em;font-size:.95em;border-radius:7px;box-shadow:none}
.rc-disc span{font-weight:900;font-size:.88em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rc-3>*{min-width:0}
.rf-ov{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rf-ov .rf-top{position:sticky;top:0;z-index:2;padding:4px 0 8px;background:var(--bg)}
.rc.rf{flex:none;font-size:15px;gap:16px;padding:18px 16px 24px;cursor:default}
.rc.rf .rc-v{max-height:none}
.rc.rf .rc-hero .n{font-size:2.4em}
.rf-who{display:flex;gap:14px;align-items:center}
.rf-who img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid var(--f);flex:none}
.rf-who b{display:block;font-size:1.25em;font-weight:900}
.rf-who span{display:block;font-weight:800;color:var(--f)}
.rf-who em{display:block;font-style:normal;font-size:.85em;font-weight:700;color:var(--muted)}
.rf-sec{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.rf-h{font-family:var(--font-display);font-size:1.05em;color:var(--d)}
.rf-l{font-size:.72em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.rf-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:10px;font-size:.92em}
.rf-row span{color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.rf-row b{font-weight:800;overflow-wrap:anywhere}
.rf-bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:10px;align-items:center}
.rf-bl b{display:block;font-weight:900;font-size:.9em}
.rf-bl em{display:block;font-style:normal;font-size:.75em;color:var(--dim);font-weight:700}
.rf-bar>span{font-family:var(--font-display);font-size:.9em;text-align:right}
.rf-q{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.rf-q div{padding:8px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.rf-q div.ok{background:var(--m);border-color:var(--m);color:var(--ink)}
.rf-q span{display:block;font-size:.7em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.rf-q b{font-family:var(--font-display);font-weight:400}
.rf-p{margin:0;line-height:1.5;font-weight:600}
.rf-k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.rf-k3 div{padding:9px 10px;border-radius:12px;background:var(--surface);min-width:0}
.rf-k3 span{display:block;font-size:.68em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rf-k3 b{display:block;font-family:var(--font-display);font-weight:400;font-size:1em;margin-top:2px;overflow-wrap:anywhere}
.rf-k3 em{display:block;font-style:normal;font-size:.78em;font-weight:700;color:var(--muted)}
.autor{display:grid;gap:8px;padding:16px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.autor .lab{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--d)}
.autor p{margin:0;font-size:15px;line-height:1.55;font-weight:600;color:var(--fg)}
.rf-ans{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:.9em}
.rf-ans span{display:block;color:var(--muted);font-weight:700}
.rf-ans b{display:block;font-weight:800}
.rank span#rankN{letter-spacing:.02em;color:var(--fg)}
@media (max-width:360px){.rank span#rankN{letter-spacing:0;font-size:11px}.clock{font-size:12px;padding:6px 5px}.hud-row{gap:7px}}
.barrow{display:flex;align-items:center;gap:8px;margin-top:5px}.barrow .bar{flex:1;margin-top:0}
#xpN{flex:none;font-weight:900;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:420px){.clock svg{display:none}.clock{padding:6px 7px}}
.tlab{font-weight:800;font-size:14px;margin-bottom:-6px}
.arena{grid-template-columns:minmax(0,1fr)}.arena .dots{width:100%;justify-content:center;gap:4px}.arena .dots i{flex:1 1 0;max-width:28px;min-width:6px}
.sitimg{width:100%;aspect-ratio:200/112;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#2D2762}
.sitimg svg{display:block;width:100%;height:100%}
.codebox{display:grid;gap:8px;padding:14px;border-radius:18px;background:var(--bg);border:2px solid var(--d-d);text-align:center;justify-items:center}
.codebox .lab{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--d)}
.codebox .hc{font-family:var(--font-display);font-size:clamp(18px,5.6vw,24px);line-height:1.1}
.codebox code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--surface2);overflow-wrap:anywhere}
.rc-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:.8em;color:var(--d);overflow-wrap:anywhere}
.media{display:grid;gap:10px;padding:14px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.media h3{font-size:16px}
.media .mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.media .mbtns label{cursor:pointer}
.media .mbtns svg{width:20px;height:20px}
.media input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.prev{position:relative;display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface2)}
.prev img{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none}
.prev video{width:96px;height:128px;border-radius:12px;object-fit:cover;background:#000;flex:none}
.prev .pi{flex:1;min-width:0;display:grid;gap:6px;font-weight:800;font-size:14px}
.prev .pi small{color:var(--muted);font-weight:700;font-size:12px}
.upl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--dim)}
.upl .chip{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}
.upl .chip svg{width:15px;height:15px}
.cam-ov{position:fixed;inset:0;z-index:95;background:#0B0920;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.cam{width:100%;max-width:520px;display:grid;gap:12px}
.cam-v{position:relative;width:100%;max-width:min(100%,60vh);margin:0 auto;aspect-ratio:1;border-radius:22px;overflow:hidden;background:#000;border:2px solid var(--line)}
.cam-v video{width:100%;height:100%;object-fit:cover;display:block}
.cam-v video.mirror{transform:scaleX(-1)}
.cam-frame{position:absolute;inset:14%;border-radius:50%;border:2px dashed rgba(255,255,255,.35);pointer-events:none}
.cam-rec{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.55);font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.cam-rec i{width:10px;height:10px;border-radius:50%;background:var(--e);animation:micPulse 1s infinite}
.cam-st{text-align:center;color:var(--muted);font-weight:700;font-size:14px;min-height:2.6em}
.cam-st.err{color:var(--f)}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.cam-shot{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;display:grid;place-items:center}
.cam-shot i{width:56px;height:56px;border-radius:50%;background:#fff;transition:all .2s}
.cam-shot.video i{background:var(--e)}
.cam-shot.on i{width:28px;height:28px;border-radius:8px}
.cam-shot:disabled{opacity:.4}
.nps{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.nps h3{font-size:16px}
.nps-row{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.nps-b{aspect-ratio:1;min-width:0;padding:0;border:none;border-radius:9px;font-family:var(--font-display);font-size:clamp(11px,3.4vw,15px);color:var(--fg);background:var(--surface2);box-shadow:0 3px 0 #1E1A44}
.nps-b.on.lo{background:var(--e);color:#fff;box-shadow:0 3px 0 var(--e-d)}
.nps-b.on.mid{background:var(--f);color:var(--ink);box-shadow:0 3px 0 var(--f-d)}
.nps-b.on.hi{background:var(--m);color:var(--ink);box-shadow:0 3px 0 var(--m-d)}
.nps-b:active{transform:translateY(2px);box-shadow:none}
.nps-lg{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--dim)}
.cepst{font-size:12.5px;font-weight:800;color:var(--dim);margin-top:-6px}
.cepst.ok{color:var(--m)} .cepst.err{color:var(--f)}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--f);box-shadow:0 5px 0 var(--f-d)}
.rc-who .ph{width:2.6em;height:2.6em;border-radius:50%;object-fit:cover;border:2px solid var(--f);flex:none}
.rc-who .nm{display:flex;align-items:center;gap:8px;min-width:0}
.unitl{font-size:12px;font-weight:800;color:var(--dim);margin-top:-2px}
</style>

const NQ = QS.length;
const PERM = [[2,0,3,1],[1,3,0,2],[3,1,2,0],[0,2,1,3],[2,3,0,1],[1,0,3,2]];
const permOf = qi => PERM[qi % PERM.length];
const MOT_APPEAR = (()=>{ const a = {}; QS.forEach(q=>{ if(q.dim==="motiv") q.o.forEach(o=>a[o.k]=(a[o.k]||0)+1); }); return a; })();
function profile(){
  const cnt = {D:0,I:0,S:0,C:0}, first = {}, mc = {THE:0,UTI:0,AES:0,SOC:0,IND:0,TRA:0}, mfirst = {};
  let lc = 0, nlc = 0, ie = 0, nie = 0, nd = 0, n = 0;
  S.ans.forEach((a,qi)=>{ if(a===null || a===undefined) return; const q = QS[qi], o = q.o[a]; n++;
    if(q.dim==="disc"){ nd++; cnt[o.k]++; if(first[o.k]===undefined) first[o.k] = qi; }
    else if(q.dim==="motiv"){ mc[o.k]++; if(mfirst[o.k]===undefined) mfirst[o.k] = qi; }
    else if(q.dim==="ie"){ ie += o.k; nie++; }
    else if(q.dim==="lc"){ lc += o.k; nlc++; } });
  const order = Object.keys(cnt).sort((a,b)=> cnt[b]-cnt[a] || (first[a]??99)-(first[b]??99));
  const pct = {}; Object.keys(cnt).forEach(k=>pct[k] = nd ? Math.round(cnt[k]/nd*100) : 0);
  const mpct = {}; Object.keys(mc).forEach(k=>mpct[k] = Math.round(mc[k]/(MOT_APPEAR[k]||1)*100));
  const morder = Object.keys(mc).sort((a,b)=> mpct[b]-mpct[a] || (mfirst[a]??99)-(mfirst[b]??99));
  const lcs = nlc ? Math.round((lc-nlc)/(3*nlc)*100) : 0, ies = nie ? Math.round((ie-nie)/(3*nie)*100) : 0;
  const p1 = order[0], p2 = cnt[order[1]] ? order[1] : null;
  const mot = mc[morder[0]] ? morder[0] : null, mot2 = mc[morder[1]] ? morder[1] : null;
  const lcCat = lcs>66?"Interno":lcs<33?"Externo":"Misto", ieCat = ies>66?"Alta":ies<33?"Baixa":"Moderada";
  const code = nd ? p1 + (p2 ? p2.toLowerCase() : "") : "?";
  const lcT = {Interno:"int",Misto:"mix",Externo:"ext"}[lcCat], ieT = {Alta:"high",Moderada:"mid",Baixa:"low"}[ieCat];
  const full = nd ? `${code} LC${lcT} IE${ieT} M${(mot||"").toLowerCase()}` : "?";
  return {n, nd, cnt, pct, order, p1, p2, code, full, lc:lcs, lcCat, ie:ies, ieCat, mot, mot2, mpct, morder};
}
/* código para o próximo episódio (anunciante da vaga):
   S4D1-<estilo>-<D><I><S><C>-<LC>-<IE>-<M1><M2>-<VAGA>-<verificador>
   ex.: S4D1-Di-50250025-67-78-UTISOC-ART-K  (pontuações 00 a 99, 100 vira 99) */
const pad2 = v => String(Math.min(99, Math.max(0, Math.round(v)))).padStart(2,"0");
function selfCode(){
  const P = profile(), pos = posOf(S.pos);
  if(nAns() < NQ) return "";
  const body = ["S4D1", P.code, "DISC".split("").map(k=>pad2(P.pct[k])).join(""), pad2(P.lc), pad2(P.ie),
    (P.mot||"XXX")+(P.mot2||"XXX"), pos ? pos.code : "XXX"].join("-");
  const sum = [...body].reduce((a,c)=>a + c.charCodeAt(0), 0);
  return body + "-" + (sum % 36).toString(36).toUpperCase();
}

const SND = (()=>{
  let ctx = null, on = true, big = 0;
  try{ on = localStorage.getItem("fdem-sound") !== "off"; }catch(e){}
  function ac(){
    if(!ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; try{ ctx = new C(); }catch(e){ return null; } }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(f, t0, d, type, v, f2){
    const c = ac(); if(!c) return;
    const now = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle"; o.frequency.setValueAtTime(f, now);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
    g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(v || .12, now + .012); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g); g.connect(c.destination); o.start(now); o.stop(now + d + .05);
  }
  const N = {G4:392,C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5,G6:1568};
  const seq = (ns, st, ty, v, d) => ns.forEach((f,i)=>tone(f, i*st, d || st*1.8, ty, v));
  const FX = {
    tick:  ()=>{ tone(1320,0,.07,"sine",.07); tone(1760,.05,.08,"sine",.05); },
    click: ()=>tone(700,0,.05,"square",.035),
    yes:   ()=>tone(820,0,.1,"triangle",.1,1150),
    no:    ()=>tone(360,0,.12,"triangle",.1,240),
    warn:  ()=>{ tone(240,0,.12,"square",.05); tone(200,.11,.18,"square",.05); },
    F:     ()=>seq([N.C5,N.E5,N.G5,N.C6,N.E6],.07,"triangle",.13),
    D:     ()=>{ tone(N.G5,0,.12,"sine",.13); tone(N.C6,.1,.3,"sine",.13); },
    E:     ()=>tone(720,0,.38,"sawtooth",.05,130),
    M:     ()=>{ tone(380,0,.32,"triangle",.11,1100); tone(N.E6,.3,.2,"sine",.06); },
    phase: ()=>{ seq([N.C5,N.E5,N.G5],.09,"square",.055); tone(N.C6,.27,.5,"triangle",.14); tone(N.E6,.27,.5,"sine",.05); },
    level: ()=>{ seq([N.G4,N.C5,N.E5,N.G5,N.C6,N.E6],.06,"square",.05); tone(N.G6,.38,.35,"sine",.05); },
    trophy:()=>{ const st=.14; [N.G4,N.C5,N.E5,N.G5,N.E5].forEach((f,i)=>tone(f,i*st,st*1.4,"square",.055)); [N.G5,N.C6,N.E6].forEach(f=>tone(f,5*st,1,"triangle",.09)); },
    chime: ()=>[N.E6,N.C6,N.G5,N.C6].forEach((f,i)=>tone(f,i*.12,.7,"sine",.08))
  };
  const BIG = ["F","D","E","M","phase","level","trophy","chime"];
  return {
    play(n){ if(!on || !FX[n]) return; if(n==="tick" && Date.now()-big < 900) return; if(BIG.includes(n)) big = Date.now(); try{ FX[n](); }catch(e){} },
    get on(){ return on; },
    toggle(){ on = !on; try{ localStorage.setItem("fdem-sound", on ? "on" : "off"); }catch(e){} if(on){ ac(); FX.yes(); } return on; }
  };
})();
function syncSound(){

/* ---------- HUD ---------- */
let lastXP = null, xpTimer = null, xpAcc = 0;
function hud(){
  const x = xp(), lv = levelOf(x), inLv = x % XP_PER_LVL;
  const el = $("#hud");
  if(!el) return;
  $("#lvN").textContent = lv;
  $("#xpN").textContent = x + " XP";
  $("#xpBar").style.width = (inLv/XP_PER_LVL*100) + "%";
  $("#clockN").textContent = nAns() + "/" + NQ;
  if(lastXP !== null && x > lastXP){
    const gain = x - lastXP; xpAcc += gain;
    if(levelOf(x) > levelOf(lastXP)){ toast(`Subiu para o nível <b>${lv}</b> · ${esc(rankOf(x))}`); burst(60); SND.play("level"); track("level_up",{level:lv}); }
    clearTimeout(xpTimer);
    xpTimer = setTimeout(()=>{ const f = document.createElement("div"); f.className="xpfloat"; f.textContent = "+"+xpAcc+" XP"; document.body.appendChild(f); setTimeout(()=>f.remove(),1300); xpAcc = 0; SND.play("tick"); }, 450);
  }
  lastXP = x;
  document.querySelectorAll(".node").forEach(n=>{
    const i = +n.dataset.go;
    n.classList.toggle("done", i<LAST ? complete(i) : complete(LAST-1));
    n.classList.toggle("open", unlocked(i));
    n.classList.toggle("lockedn", !unlocked(i));
  });
  const doneCount = PH.slice(0,LAST).map((_,i)=>i).filter(complete).length;
  const p = $("#mapProg"); if(p) p.style.width = `calc((100% - 40px) * ${Math.min(doneCount,LAST)/LAST})`;
}

/* vídeo: guardado no IndexedDB deste aparelho */
const VIDEO = {blob:null, url:null};
const VDB = {
  open(){ return new Promise((ok,ko)=>{ try{ const q = indexedDB.open("selfpararh", 1); q.onupgradeneeded = ()=>q.result.createObjectStore("m"); q.onsuccess = ()=>ok(q.result); q.onerror = ()=>ko(q.error); }catch(e){ ko(e); } }); },
  async op(mode, fn){ const db = await this.open(); return new Promise((ok,ko)=>{ const tx = db.transaction("m", mode); const q = fn(tx.objectStore("m")); tx.oncomplete = ()=>ok(q && q.result); tx.onerror = ()=>ko(tx.error); }); },
  put(b){ return this.op("readwrite", st=>st.put(b, "video")); },
  get(){ return this.op("readonly", st=>st.get("video")); },
  del(){ return this.op("readwrite", st=>st.delete("video")); }
};
function setVideo(blob){ if(VIDEO.url) URL.revokeObjectURL(VIDEO.url); VIDEO.blob = blob; VIDEO.url = blob ? URL.createObjectURL(blob) : null; }
(async()=>{ if(!S.video) return; try{ const b = await VDB.get(); if(b){ setVideo(b); if(S.step===5) render(); } else { S.video = null; save(); } }catch(e){} })();
async function onMedia(input){
  const f = input.files && input.files[0]; input.value = ""; if(!f) return;
  return addMedia(input.dataset.media, f, 0, "file");
}
async function addMedia(kind, f, knownDur, how){
  const wasDone = doneSnapshot[5];
  if(kind==="photo"){
    try{
      const url = URL.createObjectURL(f); const img = new Image();
      await new Promise((ok,ko)=>{ img.onload = ok; img.onerror = ko; img.src = url; });
      const side = Math.min(img.naturalWidth, img.naturalHeight), sz = Math.min(480, side);
      const c = document.createElement("canvas"); c.width = c.height = sz;
      c.getContext("2d").drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, sz, sz);
      URL.revokeObjectURL(url);
      S.photo = c.toDataURL("image/jpeg", .82); save(); SND.play("F"); burst(40); track("media_added",{type:"photo", source:how});
    }catch(e){ toast("Não consegui ler a foto. Tente de novo.", true); return; }
  } else {
    if(f.size > 80*1048576){ toast("Vídeo muito grande. Grave até uns 30 segundos.", true); return; }
    let dur = knownDur || 0;
    if(!dur){ try{ const u = URL.createObjectURL(f), el = document.createElement("video"); el.preload = "metadata"; el.src = u;
      await new Promise(ok=>{ el.onloadedmetadata = ok; el.onerror = ok; setTimeout(ok, 3000); }); dur = isFinite(el.duration) ? el.duration : 0; URL.revokeObjectURL(u); }catch(e){} }
    setVideo(f); S.video = {size:f.size, type:f.type||"video/mp4", dur}; save();
    try{ await VDB.put(f); }catch(e){ toast("O vídeo fica disponível só até fechar esta página.", true); }
    SND.play("F"); burst(40); track("media_added",{type:"video", source:how});
  }
  render(); checkPhaseDone(wasDone);
}
/* câmera na própria página: funciona no celular e no computador */
const CAM = {stream:null, rec:null, chunks:[], t0:0, timer:null, facing:"user", mode:"photo"};
const MAXSEC = 30;
function camFallback(mode){ const el = document.getElementById(mode==="photo"?"upPhoto":"upVideo"); if(el){ el.setAttribute("capture","user"); el.click(); setTimeout(()=>el.removeAttribute("capture"), 500); } }
async function openCam(mode){
  CAM.mode = mode;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || (mode==="video" && !window.MediaRecorder)){ return camFallback(mode); }
  closeCam();
  const ov = document.createElement("div"); ov.className = "cam-ov"; ov.id = "camOv"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label", mode==="photo"?"Tirar foto":"Gravar vídeo");
  ov.innerHTML = `<div class="cam">
    <div class="cam-v"><video id="camV" autoplay playsinline muted></video><div class="cam-frame"></div><div class="cam-rec" id="camRec" hidden><i></i><span id="camT">0s</span> / ${MAXSEC}s</div></div>
    <p class="cam-st" id="camSt">Abrindo a câmera…</p>
    <div class="cam-bar">
      <button class="btn ghost small" data-act="camclose">Fechar</button>
      <button class="cam-shot ${mode}" id="camShot" data-act="camshot" aria-label="${mode==="photo"?"Tirar foto":"Gravar"}" disabled><i></i></button>
      <button class="btn ghost small" data-act="camflip">Virar</button>
    </div></div>`;
  document.body.appendChild(ov); document.documentElement.style.overflow = "hidden";
  await camStart();
}
async function camStart(){
  const st = $("#camSt"), v = $("#camV");
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream = null; }
  try{
    CAM.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.facing, width:{ideal:720}, height:{ideal:720}}, audio: CAM.mode==="video"});
    if(!$("#camOv")){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream = null; return; }
    v.srcObject = CAM.stream; v.classList.toggle("mirror", CAM.facing==="user");
    $("#camShot").disabled = false;
    st.textContent = CAM.mode==="photo" ? "Enquadre o rosto e toque no botão." : `Toque no botão para gravar até ${MAXSEC} segundos. Conte quem você é e por que quer jogar no time.`;
  }catch(e){
    const n = e && e.name;
    st.textContent = n==="NotAllowedError" ? "Sem permissão para usar a câmera. Libere o acesso no navegador ou envie um arquivo." : "Não encontrei uma câmera disponível. Você pode enviar um arquivo.";
    st.classList.add("err");
    const b = $("#camShot"); if(b){ b.outerHTML = `<button class="btn small" data-act="camfile">Enviar arquivo</button>`; }
    track("camera_error",{error:n||"unknown"});
  }
}
function closeCam(){
  if(CAM.rec && CAM.rec.state!=="inactive"){ CAM.rec.onstop = null; try{ CAM.rec.stop(); }catch(e){} }
  CAM.rec = null; clearInterval(CAM.timer);
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream = null; }
  const o = $("#camOv"); if(o){ o.remove(); document.documentElement.style.overflow = ""; }
}
function camShot(){
  const v = $("#camV"); if(!v || !CAM.stream) return;
  if(CAM.mode==="photo"){
    const w = v.videoWidth, h = v.videoHeight; if(!w) return;
    const side = Math.min(w,h), c = document.createElement("canvas"); c.width = c.height = Math.min(720, side);
    const g = c.getContext("2d"); if(CAM.facing==="user"){ g.translate(c.width,0); g.scale(-1,1); }
    g.drawImage(v, (w-side)/2, (h-side)/2, side, side, 0, 0, c.width, c.height);
    SND.play("click");
    c.toBlob(b=>{ closeCam(); if(b) addMedia("photo", b, 0, "camera"); }, "image/jpeg", .9);
    return;
  }
  if(CAM.rec && CAM.rec.state==="recording"){ CAM.rec.stop(); return; }
  const types = ["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const type = types.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } }) || "";
  let rec; try{ rec = new MediaRecorder(CAM.stream, type ? {mimeType:type, videoBitsPerSecond:1200000} : undefined); }catch(e){ toast("Este navegador não grava vídeo. Envie um arquivo.", true); return; }
  CAM.rec = rec; CAM.chunks = [];
  rec.ondataavailable = e=>{ if(e.data && e.data.size) CAM.chunks.push(e.data); };
  rec.onstop = ()=>{ const dur = (Date.now()-CAM.t0)/1000; const blob = new Blob(CAM.chunks, {type: rec.mimeType || type || "video/webm"}); closeCam(); if(blob.size) addMedia("video", blob, dur, "camera"); };
  rec.start(500); CAM.t0 = Date.now(); SND.play("click");
  $("#camShot").classList.add("on"); $("#camRec").hidden = false; $("#camSt").textContent = "Gravando… toque de novo para parar.";
  const flip = document.querySelector("[data-act=camflip]"); if(flip) flip.disabled = true;
  CAM.timer = setInterval(()=>{ const s2 = Math.floor((Date.now()-CAM.t0)/1000); const el = $("#camT"); if(el) el.textContent = s2+"s"; if(s2 >= MAXSEC && rec.state==="recording") rec.stop(); }, 250);
}
document.addEventListener("change", e=>{ const el = e.target; if(el && el.dataset && el.dataset.media) onMedia(el); });
let cepLast = "";
async function cepLookup(){
  const d = digits(S.cep); if(d.length!==8 || d===cepLast) return; cepLast = d;
  const st = $("#cepSt"); const say = (m,c)=>{ cepMsg = m; cepCls = c||""; if(st){ st.textContent = m; st.className = "cepst "+cepCls; } };
  say("Buscando endereço…");
  try{
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 6000);
    const j = await (await fetch(`https://viacep.com.br/ws/${d}/json/`, {signal:ctl.signal})).json(); clearTimeout(tm);
    if(j.erro){ say("CEP não encontrado. Confira ou preencha o endereço à mão.","err"); return; }
    const wasDone = doneSnapshot[5];
    if(j.logradouro) S.addr = j.logradouro; if(j.bairro) S.district = j.bairro; if(j.localidade) S.city = j.localidade+(j.uf?"/"+j.uf:"");
    S.cep = fmtCep(d); save(); say("Endereço encontrado. Confira e complete o número.","ok");
    render(t(S.addr) ? "u-num" : "u-addr"); checkPhaseDone(wasDone);
  }catch(e){ say("Não consegui buscar o CEP agora. Preencha o endereço à mão.","err"); }
}

/* retrato: uma qualidade por dimensão, um elogio que junta as quatro e o status */
const Q_DISC = {D:"Decidido", I:"Comunicativo", S:"Parceiro", C:"Caprichoso"};
const Q_IE   = {Alta:"Equilibrado", Moderada:"Sensível", Baixa:"Espontâneo"};
const Q_LC   = {Interno:"Protagonista", Misto:"Realista", Externo:"Adaptável"};
const Q_MOT  = {THE:"Curioso", UTI:"Realizador", AES:"Harmonioso", SOC:"Prestativo", IND:"Ambicioso", TRA:"Confiável"};
const P_MOT  = {THE:"movido a aprender", UTI:"movido a resultado", AES:"movido a harmonia", SOC:"movido a ajudar", IND:"movido a crescer", TRA:"movido a valores"};
const P_IE   = {Alta:"com muito equilíbrio", Moderada:"com sensibilidade", Baixa:"com autenticidade"};
function portrait(){
  const P = profile();
  if(!P.p1) return null;
  const q = {disc:Q_DISC[P.p1], ie:Q_IE[P.ieCat], mot:P.mot?Q_MOT[P.mot]:"Motivado", lc:Q_LC[P.lcCat]};
  const praise = `${q.disc} e ${q.lc.toLowerCase()}, ${P.mot?P_MOT[P.mot]:"cheio de vontade"} ${P_IE[P.ieCat]}.`;
  return {q, praise, status:"APTO A PROSSEGUIR NO PROCESSO", cards:[
    {k:"Estilo", v:q.disc, c:"f"}, {k:"Emoções", v:q.ie, c:"d"}, {k:"Motivação", v:q.mot, c:"m"},
    {k:"Locus", v:q.lc, c:"e"}, {k:"Status", v:"APTO A PROSSEGUIR NO PROCESSO", c:"ok"}]};
}
/* auto-retrato: 2 parágrafos em linguagem simples, sempre positivos e neutros (sem recomendação de carreira) */
const A_DISC = {
  D:"tem um jeito direto e prático de agir: gosta de resolver, decide com rapidez e mantém o foco no que precisa ser feito",
  I:"tem um jeito comunicativo e animado: gosta de conversar, aproxima as pessoas e deixa o ambiente mais leve",
  S:"tem um jeito calmo e constante: é parceiro, paciente e ajuda o time a manter o ritmo com tranquilidade",
  C:"tem um jeito cuidadoso e organizado: presta atenção aos detalhes, segue o passo a passo e gosta de fazer tudo bem feito"};
const A_DISC2 = {
  D:"Também mostra iniciativa para tomar a frente quando é preciso.",
  I:"Também mostra facilidade para se relacionar e puxar uma boa conversa.",
  S:"Também mostra paciência e disposição para apoiar quem está ao lado.",
  C:"Também mostra capricho e atenção à qualidade do que entrega."};
const A_IE = {
  Alta:"Nos momentos de pressão, você costuma manter a calma, entender o lado das outras pessoas e cuidar bem das próprias emoções.",
  Moderada:"Nos momentos de pressão, você percebe o que sente e o que as pessoas ao redor sentem, e busca equilibrar as emoções com o que precisa ser feito.",
  Baixa:"Nos momentos de pressão, você reage com autenticidade e sinceridade, mostrando com clareza o que sente."};
const A_LC = {
  Interno:"Você sente que os resultados dependem muito das suas atitudes, por isso costuma assumir responsabilidades e agir para fazer as coisas acontecerem.",
  Misto:"Você enxerga que os resultados vêm tanto das suas atitudes quanto das circunstâncias, o que traz uma visão equilibrada e realista do dia a dia.",
  Externo:"Você tem uma boa leitura do que acontece ao seu redor e se adapta com facilidade às circunstâncias de cada momento."};
const A_MOT = {
  THE:"O que mais te motiva é aprender: entender como as coisas funcionam e ganhar conhecimento novo.",
  UTI:"O que mais te motiva é ver resultado: perceber que o seu esforço vira algo concreto.",
  AES:"O que mais te motiva é a harmonia: um ambiente organizado, bonito e com clima bom.",
  SOC:"O que mais te motiva é ajudar: fazer diferença para clientes e colegas.",
  IND:"O que mais te motiva é crescer: ter autonomia e espaço para novos desafios.",
  TRA:"O que mais te motiva é agir com valores: fazer o certo, com respeito e coerência."};
const A_MOT2 = {THE:"aprender coisas novas", UTI:"ver resultados concretos", AES:"um ambiente harmonioso", SOC:"ajudar as pessoas", IND:"ter autonomia para crescer", TRA:"agir com coerência e respeito"};
function analysis(){
  const P = profile(); if(!P.p1) return [];
  const p1 = `Você ${A_DISC[P.p1]}.${P.p2 ? " " + A_DISC2[P.p2] : ""} ${A_IE[P.ieCat]}`;
  const p2 = `${A_LC[P.lcCat]} ${P.mot ? A_MOT[P.mot] : ""}${P.mot2 ? ` Você também valoriza ${A_MOT2[P.mot2]}.` : ""} Este é um retrato do seu jeito de ser hoje, feito a partir das suas próprias escolhas.`;
  return [p1, p2.replace(/\s+/g," ").trim()];
}
function achievements(){
  const P = profile();
  return [
    {n:"Escalado", on:complete(0)},
    {n:"Sincero", on:complete(1)},
    {n:"Perfil SELF", on:complete(2)},
    {n:"Bagagem", on:complete(3)},
    {n:"Estudioso", on:complete(4)},
    {n:"Pronto pro jogo", on:complete(5)}
  ];
}
function discLine(P){ return P.p1 ? DISC[P.p1].nick + (P.p2 ? " + " + DISC[P.p2].nick : "") : ""; }
function summaryText(){
  const P = profile(), pos = posOf(S.pos);
  const L = [];
  L.push(`*${PROGRAM} · ${EPISODE}*`, `_${HUD_TITLE}_`, "");
  if(t(S.name)) L.push("*Nome:* "+t(S.name)); if(t(S.phone)) L.push("*WhatsApp:* "+t(S.phone)); if(t(S.email)) L.push("*E-mail:* "+t(S.email));
  if(t(S.city)) L.push("*Cidade:* "+t(S.city)+(cepOk()?" · CEP "+fmtCep(S.cep):""));
  L.push("*Vaga:* "+(pos?pos.title:"-"), "");
  L.push("*Por que este time:* "+[...S.why.tags, t(S.why.text)].filter(Boolean).join(" · "), "");
  L.push(`*Perfil SELF:* ${P.code} (${discLine(P)})`);
  L.push(`*Código SELF:* ${P.full}`);
  { const R = portrait(); if(R){ L.push(`*Qualidades:* ${R.q.disc} · ${R.q.ie} · ${R.q.mot} · ${R.q.lc}`); L.push(`*Status:* ${R.status}`); } }
  L.push(`*Código para o RH:* ${selfCode()}`);
  L.push(`*Estilo:* ${"DISC".split("").map(k=>k+" "+P.pct[k]+"%").join(" · ")}`);
  L.push(`*Locus:* ${P.lcCat} · *Emoções (IE):* ${P.ieCat} · *Motivação:* ${P.mot?MOT[P.mot].name:"-"}${P.mot2?" e "+MOT[P.mot2].name:""}`, "");
  { const A = analysis(); if(A.length){ L.push("*Auto-retrato:*", ...A.flatMap((x2,i)=>i?["",x2]:[x2]), ""); } }
  L.push("*Experiência:*"); if(S.exp.first) L.push("Primeiro emprego"); else S.exp.list.filter(expOk).forEach(r=>L.push(`${t(r.role)} na ${t(r.company)} (${tenure(r)})`)); L.push("");
  L.push("*Formação:*"); S.edu.list.filter(eduOk).forEach(r=>L.push(`${t(r.course)} · ${t(r.school)} (${t(r.year)})`));
  if(S.video) L.push("", "_Envio também um vídeo de apresentação._");
  if(S.nps!==null){ L.push("", `*Nota da experiência (NPS):* ${S.nps}/10`); if(t(S.npsText)) L.push("_"+t(S.npsText)+"_"); }
  L.push("", "Resultado orientativo, baseado em "+NQ+" situações.");
  L.push("Faça você também: " + location.origin + "/selfpararh");
  return L.join("\n");
}

/* ---------- render ---------- */
const SCREENS = [screen0,screen1,screen2,screen3,screen4,screen5,screen6];
let doneSnapshot = [];
function render(focusId){
  const app = $("#app");
  const body = S.step < 0 ? screenWelcome() : SCREENS[S.step]();
  app.innerHTML = `<div class="wrap">${S.step<0?"":hudHTML()}${body}<div class="foot"><a class="hub-link" href="/">‹ Todos os episódios da Canetinha Mágica</a><div class="brand"><img src="${LOGO_MARK}" alt=""><img src="${LOGO_WORD}" alt="Proselling"></div>${PROGRAM} · Episódio ${EPISODE}<br>Ferramenta de uso interno em programas de aceleração comercial e desenvolvimento de lideranças.<br><span class="ver">Canetinha Mágica v__VERSION__</span></div></div>`;
  micDecorate(); syncSound();
  hud();
  doneSnapshot = PH.map((_,i)=>complete(i));
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); }
  if(S.step===0) carInit();
}
function carInit(){
  const car = $("#car"); if(!car) return;
  const sel = POS.findIndex(p=>p.id===S.pos);
  if(sel > 0){ const c = car.children[sel]; car.scrollLeft = c.offsetLeft - (car.clientWidth - c.offsetWidth)/2; }
  let tm; car.addEventListener("scroll", ()=>{ clearTimeout(tm); tm = setTimeout(()=>{
    const mid = car.scrollLeft + car.clientWidth/2; let best = 0, bd2 = 1e9;
    [...car.children].forEach((c,i)=>{ const d = Math.abs(c.offsetLeft + c.offsetWidth/2 - mid); if(d < bd2){ bd2 = d; best = i; } });
    document.querySelectorAll("#cdots button").forEach((b,i)=>b.classList.toggle("on", i===best)); }, 60); }, {passive:true});
}
function go(i){
  if(i>=0 && !unlocked(i)){ for(let k=0;k<i;k++){ if(!complete(k)){ if(k===S.step) showMissing(k); else toast(esc(`Conclua antes a fase ${k} · ${PH[k].label}`), true); return; } } return; }
  if(i===2 && S.step!==2){ const q = S.ans.findIndex(a=>a===null); S.qi = q<0 ? NQ : q; }
  S.step = i; confirmReset = false; showCopy = false; save(); render();
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  if(i===LAST){ burst(140); SND.play("trophy"); const P = profile(); track("trophy_reached",{xp:xp(), position:S.pos}); }
}
function checkPhaseDone(wasDone){
  const i = S.step; if(i<0 || i>=LAST) return;
  const now = complete(i);
  if(now && !wasDone){ toast(`Fase ${i} concluída <b>+100 XP</b>`); burst(90); SND.play("phase"); track("phase_complete",{phase:i, phase_name:PH[i].label}); }
  doneSnapshot[i] = now;
  const q = $("#quest"); if(q) q.classList.toggle("ok", now);
  const n = $("#next"); if(n) n.classList.toggle("locked", !now);
}

function setBind(path, v){
  const p = path.split(".");
  if(p[0]==="why") S.why[p[1]] = v;
  else if(["name","phone","email","cep","addr","num","district","city","npsText"].includes(p[0])) S[p[0]] = v;
  else if(p[0]==="exp"){ const r = S.exp.list.find(r=>r.id===p[1]); if(r) r[p[2]] = v; }
  else if(p[0]==="edu"){ const r = S.edu.list.find(r=>r.id===p[1]); if(r) r[p[2]] = v; }
}

const onEdit = e=>{
  const el = e.target, b = el.dataset && el.dataset.bind; if(!b) return;
  const wasDone = doneSnapshot[S.step];
  setBind(b, el.value); save();
  el.classList.toggle("filled", !!t(el.value));
  const m = el.closest("[data-entry]");
  if(m){ const [k,id] = m.dataset.entry.split("."); const r = (k==="x"?S.exp:S.edu).list.find(r=>r.id===id); if(r) m.classList.toggle("ok", k==="x"?expOk(r):eduOk(r)); }
  if(b==="cep") cepLookup();
  if(S.step===LAST){ const w=$("#waBtn"); if(w) w.href="https://wa.me/?text="+encodeURIComponent(summaryText()); }
  hud();
  checkPhaseDone(wasDone);
};
document.addEventListener("input", onEdit);
document.addEventListener("change", onEdit);

function answer(k){
  const qi = S.qi, wasDone = doneSnapshot[2];
  S.ans[qi] = k; save(); SND.play("yes"); track("question_answered",{question:qi+1});
  document.querySelectorAll(".ans").forEach(b=>b.classList.toggle("sel", +b.dataset.ans===k));
  burst(18, ["F","D","E","M"][permOf(qi).indexOf(k)]);
  setTimeout(()=>{
    let nx = -1; for(let j=1;j<=NQ;j++){ const c = (qi+j)%NQ; if(S.ans[c]===null){ nx = c; break; } }
    S.qi = nx<0 ? NQ : nx; save(); render(); checkPhaseDone(wasDone);
    if(nx<0){ SND.play("F"); burst(60); }
    const ar = $(".arena"); if(ar) ar.scrollIntoView({block:"start", behavior:"smooth"});
  }, 380);
}

  const act = b.dataset.act;

  if(b.dataset.nps !== undefined){ const first = S.nps===null; S.nps = +b.dataset.nps; save(); SND.play(S.nps>=9?"F":"yes"); if(first) burst(30);
    track("nps_answered",{score:S.nps, category:S.nps>=9?"promotor":S.nps>=7?"neutro":"detrator"});
    const y0 = window.scrollY; render(); window.scrollTo(0,y0); return; }
  if(act==="consent"){ const wasDone = doneSnapshot[5]; S.consent = !S.consent; save(); SND.play(S.consent?"yes":"click"); b.classList.toggle("on", S.consent); b.setAttribute("aria-pressed", S.consent); hud(); checkPhaseDone(wasDone); return; }
  if(act==="rmphoto"){ S.photo = ""; save(); render(); return; }
  if(act==="rmvideo"){ S.video = null; setVideo(null); save(); try{ VDB.del(); }catch(e){} render(); return; }

  if(act==="first"){ const wasDone = doneSnapshot[3]; S.exp.first = !S.exp.first; save(); SND.play(S.exp.first?"yes":"click"); render(); checkPhaseDone(wasDone); return; }
  if(act==="copy"){ track("report_copy");

    const fallback = ()=>{ showCopy = true; render(); const ta=$("#copyTxt"); if(ta){ ta.focus(); ta.select(); } };

  }
  if(act==="pdf"){ exportPDF(); return; }

    if(!confirmReset){ confirmReset = true; render(); return; }
    S = blank(); setVideo(null); try{ VDB.del(); }catch(e){} confirmReset = false; lastXP = null; save(); render(); window.scrollTo(0,0); return;
  }
});
/* toast */
let toastT;
function toast(html, warn){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const d = document.createElement("div"); d.className="toast"+(warn?" warn":""); d.setAttribute("role","status"); d.innerHTML = ICON.star.replace("<svg",'<svg width="20" height="20"')+"<span>"+html+"</span>";
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 2600);
}

/* confetti */
const cv = $("#fx"), ctx = cv.getContext("2d");
let parts = [], raf = null;
function size(){ const r = devicePixelRatio||1; cv.width = innerWidth*r; cv.height = innerHeight*r; ctx.setTransform(r,0,0,r,0,0); }
addEventListener("resize", size); size();
function burst(n, only){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const css = getComputedStyle(document.documentElement);
  const cols = (only ? [only] : ["F","D","E","M"]).map(c=>css.getPropertyValue("--"+c.toLowerCase()).trim());
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*80, y:innerHeight*.42, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4,
    s:Math.random()*7+5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[i%cols.length], life:1, sq:Math.random()<.5});
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .009;
    ctx.save(); ctx.globalAlpha = Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if(p.sq) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); else { ctx.beginPath(); ctx.arc(0,0,p.s/2.4,0,7); ctx.fill(); }
    ctx.restore(); });
  parts = parts.filter(p=>p.life>0 && p.y < innerHeight+40);
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0,0,innerWidth,innerHeight), null);
}

/* iPhone/iPad: primeiro tenta o reconhecimento de voz do Safari (funciona quando Siri e Ditado estão ativos).
   Se falhar, a folha "Fale pelo teclado" abre o teclado no campo; iosDictate() fica disponível para esse caminho. */
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
let dictT;
function iosDictate(el){
  el.focus();
  try{ const n = el.value.length; el.setSelectionRange(n, n); }catch(e){}
  document.querySelectorAll(".dict-hint").forEach(x=>x.remove());
  const d = document.createElement("div"); d.className = "dict-hint"; d.setAttribute("role","status");
  d.innerHTML = `${ICON.mic}<span>Toque no <b>microfone do teclado</b>, no canto de baixo, e fale.</span>`;
  document.body.appendChild(d); clearTimeout(dictT); dictT = setTimeout(()=>d.remove(), 5000);
  el.addEventListener("blur", ()=>d.remove(), {once:true});
  SND.play("click"); track("voice_input",{result:"ios_keyboard"});
}
function micStart(id){
  const el = document.getElementById(id); if(!el) return;
  if(rec){ try{ rec.stop(); }catch(e){} return; }
  if(!SR || srBlocked){ return dictHelp(el, true); }
  let r; try{ r = new SR(); }catch(e){ srBlocked = true; return dictHelp(el, true); }
  r.lang = "pt-BR"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  const btn = document.querySelector(`[data-mic="${id}"]`);
  const base = el.value ? el.value.replace(/\s*$/, " ") : "";
  let got = false, done = false;
  const finish = () => { if(done) return; done = true; rec = null; if(btn) btn.classList.remove("rec"); };
  r.onresult = e => { let txt = ""; for(const res of e.results) txt += res[0].transcript; got = true;
    el.value = base + txt; el.dispatchEvent(new Event("input", {bubbles:true})); };
  r.onerror = e => { const err = e && e.error; finish();
    if(["not-allowed","service-not-allowed","audio-capture","network"].includes(err)){ srBlocked = true; if(!got) dictHelp(el, false); }
    else if(err === "no-speech") toast("Não ouvi nada. Toque no microfone e fale de novo.", true); };
  r.onend = () => { const was = !done; finish(); if(got && was){ SND.play("yes"); track("voice_input",{result:"speech"}); } };
  setTimeout(()=>{ if(!done && !got){ try{ r.abort(); }catch(e){} finish(); srBlocked = true; if(document.body.contains(el) && !$("#rcOv") && !$("#sheetOv")) dictHelp(el, false); } }, 8000);
  try{ r.start(); rec = r; if(btn) btn.classList.add("rec"); SND.play("click"); }
  catch(e){ finish(); srBlocked = true; dictHelp(el, true); }
}
function dictHelp(el, inGesture){
  track("voice_input",{result:"keyboard_help"});
  if(sheetSeen && inGesture){ el.focus(); toast("Toque no microfone do teclado para falar", true); return; }
  sheetSeen = true; sheetTarget = el.id;
  closeSheet();
  const ov = document.createElement("div"); ov.className = "sheet-ov"; ov.id = "sheetOv";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-label="Falar pelo teclado">
    <h3>Fale pelo teclado</h3>
    <p>O ditado do teclado do celular transforma sua voz em texto em qualquer campo. Toque no microfone do teclado e fale.</p>
    <div class="kbd" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="mk">${ICON.mic}</i><i class="sp"></i><i></i><i></i></div>
    <ul><li>iPhone: microfone no canto inferior direito do teclado.</li><li>Android: microfone no topo ou ao lado da barra de espaço (Gboard).</li></ul>
    <button class="btn wide" data-sheet="focus">Abrir teclado e falar</button>
    <button class="btn ghost wide small" data-sheet="close">Agora não</button>
  </div>`;
  document.body.appendChild(ov);
}

/* ---------- salvar / compartilhar arquivo ---------- */
async function saveFile(blob, filename, title){
  try{
    const file = new File([blob], filename, {type: blob.type});
    // celular/tablet: abre o compartilhar (WhatsApp, e-mail, "Salvar em Arquivos"); computador: baixa direto
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title: title || filename}); return "shared"; }
      catch(err){ if(err && err.name==="AbortError") return "cancel"; }
    }
  }catch(err){}
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return "saved";
}

async function saveCardImage(){
  const hint = $("#rcHint"), node = $("#rc");
  const say = (m, err) => { if(hint){ hint.textContent = m; hint.classList.toggle("err", !!err); } };
  if(!window.html2canvas || !node){ say("Não foi possível gerar a imagem. Tire um print da tela.", true); return; }
  say("Gerando imagem…");
  try{
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#15122E";
    // copia o relatório inteiro para fora da área com rolagem, para a imagem sair completa
    const wrap = document.createElement("div"); wrap.style.cssText = `position:absolute;left:-10000px;top:0;width:${node.offsetWidth}px`;
    const clone = node.cloneNode(true); clone.removeAttribute("id"); wrap.appendChild(clone); document.body.appendChild(wrap);
    let canvas; try{ canvas = await window.html2canvas(clone, {scale: 2, backgroundColor: bg, logging:false, windowWidth: document.documentElement.clientWidth, height: clone.scrollHeight}); } finally { wrap.remove(); }
    const blob = await new Promise(r=>canvas.toBlob(r, "image/png"));

    const slug = (t(S.name)||"participante").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");

    track("report_image", {method:r});
  }catch(e){
    const c = e && e.code;

    else if(c==="rate_limited") say("Já existe um download aguardando confirmação.");
    else say("Não foi possível salvar a imagem. Tire um print da tela.", true);
  }
}
