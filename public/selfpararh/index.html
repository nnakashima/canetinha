  "DISC".split("").forEach(k=>{ const bw = CW-62;
    fill(DC[k]); doc.roundedRect(M,y-4,7,7,1.6,1.6,"F"); font("bold",9); color(RGB.ink); doc.text(k, M+3.5, y+1, {align:"center"});
    font("bold",8.5); doc.text(T(DISC[k].name), M+10, y+1); font("normal",7.5); color(RGB.muted); doc.text(T(DISC[k].nick), M+10, y+4.6);
    fill(RGB.soft); doc.roundedRect(M+48,y-2.4,bw,4.2,2.1,2.1,"F"); if(P.pct[k]){ fill(DC[k]); doc.roundedRect(M+48,y-2.4,Math.max(4.2,bw*P.pct[k]/100),4.2,2.1,2.1,"F"); }
    font("bold",9.5); color(RGB.ink); doc.text(`${P.pct[k]}%`, W-M, y+1, {align:"right"}); y += 9; });
  y += 2; need(24);
  const kw = (CW-6)/3;
  [["LOCUS DE CONTROLE", P.lcCat, `${P.lc}/100`],["INTELIGÊNCIA EMOCIONAL", P.ieCat, `${P.ie}/100`],["MOTIVADOR PRINCIPAL", P.mot?MOT[P.mot].name:"-", P.mot?MOT[P.mot].long.split(":")[0]:""]].forEach(([l,v,s],i)=>{
    const kx = M + i*(kw+3); fill(RGB.soft); doc.roundedRect(kx,y,kw,18,3,3,"F");
    font("bold",7); color(RGB.muted); doc.text(T(l), kx+4, y+5.5, {charSpace:.3});
    font("bold",12); color(RGB.ink); doc.text(T(v), kx+4, y+11.5); font("normal",7.5); color(RGB.muted); doc.text(T(s), kx+4, y+15.5); });
  y += 24;
  // auto-retrato (sem perguntas e respostas da avaliação)
  { const A = analysis(); if(A.length){ need(14); font("bold",7.5); color(RGB.muted); doc.text(T("AUTO-RETRATO"), M, y, {charSpace:.4}); y += 5;
    A.forEach(par=>{ font("normal",10); color(RGB.ink); const ln = doc.splitTextToSize(T(par), CW); need(ln.length*4.8+3); doc.text(ln, M, y); y += ln.length*4.8 + 3; }); y += 5; } }

  // 3 experiência
  section(3, "Experiência");
  const X = S.exp.list.filter(expOk);
  if(S.exp.first || !X.length){ need(12); y += field("Histórico", S.exp.first ? "Primeiro emprego" : "-") + 6; }
  else { doc.autoTable(Object.assign({}, tableBase, { startY:y, head:[["Empresa","Cargo","Tempo de casa"]],
      body: X.map(r=>[T(t(r.company)), T(t(r.role)), T(tenure(r))]), columnStyles:{2:{cellWidth:36}} }));
    y = doc.lastAutoTable.finalY + 10; }

  // 4 formação
  section(4, "Formação");
  const D = S.edu.list.filter(eduOk);
  doc.autoTable(Object.assign({}, tableBase, { startY:y, head:[["Escola ou instituição","Curso",T("Conclusão")]],
    body: D.length ? D.map(r=>[T(t(r.school)), T(t(r.course)), T(t(r.year))]) : [["-","-","-"]], columnStyles:{2:{cellWidth:30}} }));
  y = doc.lastAutoTable.finalY + 8;

  // NPS da experiência
  if(S.nps!==null){ need(16); font("normal",7.5); color(RGB.muted); doc.text(T("NOTA DA EXPERIÊNCIA (NPS, 0 A 10)"), M, y, {charSpace:.4});
    const cat = S.nps>=9?"Promotor":S.nps>=7?"Neutro":"Detrator", col = S.nps>=9?RGB.M:S.nps>=7?RGB.F:RGB.E;
    fill(col); doc.roundedRect(M, y+2, 16, 8, 2, 2, "F"); font("bold",11); color(RGB.ink); doc.text(String(S.nps), M+8, y+7.6, {align:"center"});
    font("bold",9.5); doc.text(T(cat), M+20, y+7.4);
    if(t(S.npsText)){ font("normal",9); color(RGB.muted); const ln = doc.splitTextToSize(T(S.npsText), CW-50); doc.text(ln, M+44, y+7.4); y += Math.max(0,(ln.length-1)*4); }
    y += 13; }
  // nota
  need(16); font("normal",8); color(RGB.muted);
  const note = doc.splitTextToSize(T(`Resultado orientativo, baseado em ${NQ} situações no modelo SELF 4D. Mostra um retrato do jeito de trabalhar hoje: não é nota, não substitui entrevista nem avaliação profissional especializada e não decide sozinho uma contratação.`), CW);
  doc.text(note, M, y); y += note.length*3.8 + 6;

  // assinatura
  need(14); y += 6; draw([180,176,205]); doc.setLineWidth(.3);
  doc.line(M, y, M+75, y); doc.line(W-M-75, y, W-M, y);
  font("normal",7.5); color(RGB.muted); doc.text("Candidato(a)", M, y+4); doc.text("Recrutador(a)", W-M-75, y+4);

  // rodapé
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i);
    draw(RGB.line); doc.setLineWidth(.3); doc.line(M, H-14, W-M, H-14);
    doc.addImage(LOGO_DARK,"PNG",M,H-11.2,3.9,4.5,"dark","FAST");
    font("bold",7.5); color(RGB.ink); doc.text("Proselling", M+5.5, H-7.8);
    font("normal",7.5); color(RGB.muted); doc.text(T(`  ·  ${PROGRAM} · Episódio ${EPISODE}  ·  ${dStr} ${hStr}`), M+5.5+doc.getTextWidth("Proselling")+.5, H-7.8);
    doc.text(T(`Página ${i} de ${n}`), W-M, H-7.8, {align:"right"}); }
  // dados para leitura automática pelo RH Seleção (propriedades do PDF, texto ASCII)
  try{
    const meta = {v:1, code:selfCode(), name:t(S.name), phone:t(S.phone), email:t(S.email), city:t(S.city),
      pos: pos ? pos.code : "", posTitle: pos ? pos.title : "", why:S.why.tags.slice(0,8), first:!!S.exp.first,
      exp: S.exp.first ? [] : S.exp.list.filter(expOk).slice(0,6).map(r=>({company:t(r.company), role:t(r.role), tenure:tenure(r)})),
      edu: S.edu.list.filter(eduOk).slice(0,4).map(r=>({course:t(r.course), school:t(r.school), year:t(r.year)})),
      date: now.toISOString(), app: "selfpararh-" + APP_VERSION};
    doc.setProperties({title: T(`SELF para RH - ${t(S.name)||"Candidato(a)"}`), subject: "Relatorio SELF para RH",
      author: "Proselling - Canetinha Magica", creator: "Canetinha Magica - SELF para RH",
      keywords: "selfrh1:" + encodeURIComponent(JSON.stringify(meta))});
  }catch(e){}
  return doc;
}
async function exportPDF(){
  const st = $("#pdfStatus"), btn = $("#pdfBtn");
  const say = (m, err) => { if(st){ st.textContent = m; st.classList.toggle("err", !!err); } };
  if(!window.jspdf || !window.jspdf.jsPDF){ say("Não foi possível carregar o gerador de PDF. Verifique a conexão e recarregue a página.", true); return; }
  if(btn){ btn.classList.add("busy"); } say("Gerando PDF…");
  try{
    const doc = buildPDF();
    const blob = doc.output("blob");
    const slug = (t(S.name)||"participante").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const r = await saveFile(blob, `Canetinha-Magica-SELF-para-RH-${slug}-${stamp}.pdf`, "Relatório SELF para RH");
    if(r==="cancel"){ say("Envio cancelado. Toque em PDF completo para tentar de novo."); return; }
    say(r==="shared" ? "PDF compartilhado." : "PDF baixado na pasta de downloads. Anexe na conversa do WhatsApp ou no e-mail.");
    track("report_pdf", {method:r});
    toast("PDF gerado <b>com sucesso</b>"); burst(60); SND.play("phase");
  }catch(e){
    const c = e && e.code;
    if(c==="declined") say("Download cancelado. Toque em Gerar PDF para tentar de novo.");
    else if(c==="rate_limited") say("Já existe um download aguardando confirmação.");
    else say("Não foi possível salvar o PDF nesta visualização.", true);
  }finally{ if(btn){ btn.classList.remove("busy"); } }
}
window.__buildPDF = buildPDF;
/* ---------- abertura ---------- */
function splash(){
  const el = document.createElement("div");
  el.className = "splash"; el.id = "splash";
  const title = "Canetinha|Mágica".split("|").map((w,wi)=>w.split("").map((ch,i)=>`<span style="animation-delay:${(1.25+wi*.35+i*.05).toFixed(2)}s">${ch}</span>`).join("")).join("<br>");
  el.innerHTML = `<div class="sp">
    <div class="sp-logo"><img class="sp-mark" src="${LOGO_MARK}" alt=""><img class="sp-word" src="${LOGO_WORD}" alt="Proselling"></div>
    <div class="sp-prog">
      <div class="sp-kicker">apresenta</div>
      <h1 class="sp-title" aria-label="${PROGRAM}">${title}</h1>
      <svg class="sp-stroke" viewBox="0 0 320 34" aria-hidden="true"><defs><linearGradient id="penGrad" x1="0" x2="1"><stop offset="0" style="stop-color:var(--f)"/><stop offset=".35" style="stop-color:var(--d)"/><stop offset=".68" style="stop-color:var(--e)"/><stop offset="1" style="stop-color:var(--m)"/></linearGradient></defs>
        <path d="M8 22 C 60 6, 110 30, 165 17 S 260 6, 300 15"/><circle cx="308" cy="9" r="3.2"/><circle cx="296" cy="2.5" r="1.8"/></svg>
    </div>
    <div class="sp-ep"><span>Episódio</span><b>${EPISODE}</b></div>
    ${letters()}
    <button class="btn" id="spEnter">Entrar no episódio</button>
    <div class="sp-tap">Toque em qualquer lugar para começar</div>
  </div>`;
  document.body.appendChild(el);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sparkle = setTimeout(()=>burst(36), 2900);
  let gone = false;
  const close = ()=>{ if(gone) return; gone = true; clearTimeout(sparkle); SND.play("chime"); el.classList.add("out"); setTimeout(()=>el.remove(), reduce?0:520); };
  el.addEventListener("click", close);
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" ") close(); });
  setTimeout(()=>{ const b = document.getElementById("spEnter"); if(b) b.focus({preventScroll:true}); }, 100);
}

if(S.step > LAST || (S.step > 0 && !unlocked(S.step))) S.step = 0;
render();
splash();
})();
